{{ define "main" }}
<section class="min-h-[70vh] flex items-center justify-center bg-gradient-to-b from-periwinkle-100 via-white to-white">
  <div class="container mx-auto px-4 py-16 text-center">

    <!-- Giant Emote -->
    <div class="relative inline-block mb-8">
      <div class="w-48 h-48 sm:w-64 sm:h-64 md:w-80 md:h-80 bg-white border-4 border-alt-900 shadow-hard mx-auto overflow-hidden">
        <img id="error-emote" src="" alt="oops" class="w-full h-full object-contain p-6">
      </div>
      <!-- Decorative corners -->
      <div class="absolute -top-3 -left-3 w-8 h-8 bg-hotpink-500 border-2 border-alt-900"></div>
      <div class="absolute -top-3 -right-3 w-8 h-8 bg-purple-500 border-2 border-alt-900"></div>
      <div class="absolute -bottom-3 -left-3 w-8 h-8 bg-periwinkle-500 border-2 border-alt-900"></div>
      <div class="absolute -bottom-3 -right-3 w-8 h-8 bg-hotpink-500 border-2 border-alt-900"></div>
      <!-- Floating decorations -->
      <div class="absolute -top-6 left-1/2 -translate-x-1/2 text-3xl animate-bounce">★</div>
      <div class="absolute top-1/2 -left-8 -translate-y-1/2 text-2xl text-hotpink-500 animate-pulse">♡</div>
      <div class="absolute top-1/2 -right-8 -translate-y-1/2 text-2xl text-hotpink-500 animate-pulse">♡</div>
    </div>

    <!-- 404 Text -->
    <div class="mb-6">
      <div class="inline-flex items-center gap-3 bg-alt-900 text-white px-4 py-2 text-sm font-display uppercase tracking-widest mb-6">
        <span class="text-hotpink-400">✖</span>
        <span>Error 404</span>
        <span class="text-hotpink-400">✖</span>
      </div>

      <h1 class="font-display font-black text-5xl sm:text-6xl md:text-8xl text-alt-900 mb-4">
        Oops!
      </h1>

      <p class="text-xl sm:text-2xl text-alt-600 max-w-lg mx-auto mb-2">
        This page got <span class="text-hotpink-500 font-bold">lost</span> in the void...
      </p>

      <p class="text-alt-400 max-w-md mx-auto">
        The page you're looking for doesn't exist, was moved, or is hiding from us.
      </p>
    </div>

    <!-- Decorative divider -->
    <div class="flex items-center justify-center gap-4 mb-8">
      <div class="w-16 h-px bg-alt-200"></div>
      <div class="flex items-center gap-2 text-alt-300">
        <span>✖</span>
        <span class="text-hotpink-400">♡</span>
        <span>✖</span>
      </div>
      <div class="w-16 h-px bg-alt-200"></div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap justify-center gap-4">
      <a href="{{ "/" | relURL }}"
         class="flex items-center gap-2 bg-hotpink-500 text-white px-6 py-3 font-display font-bold text-sm uppercase tracking-wide border-2 border-alt-900 shadow-hard hover:shadow-none hover:translate-x-0.5 hover:translate-y-0.5 transition-all">
        <span>←</span>
        Go Home
      </a>

      <a href="https://twitch.tv/vvSushii" target="_blank" rel="noopener"
         class="flex items-center gap-2 bg-[#9146FF] text-white px-6 py-3 font-display font-bold text-sm uppercase tracking-wide border-2 border-alt-900 shadow-hard hover:shadow-none hover:translate-x-0.5 hover:translate-y-0.5 transition-all">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        Watch Stream Instead
      </a>
    </div>

    <!-- Fun suggestion -->
    <p class="mt-12 text-sm text-alt-400">
      Or just vibe here for a bit. We don't judge. <span class="text-hotpink-400">♡</span>
    </p>

  </div>
</section>

<!-- 404 emote randomizer - pick sad/confused emotes -->
<script>
(function() {
  const sadEmotes = [
    {{- $sadNames := slice "lost" "sad1" "sad2" "panicked" "nervous" "no_clue" "rip" "worry" "shocked" "hurt" }}
    {{- $first := true }}
    {{- range site.Data.emotes.emotes }}
      {{- if in $sadNames .name }}
        {{- if not $first }},{{ end }}""{{ (printf "images/emotes/%s" .file) | relURL }}""
        {{- $first = false }}
      {{- end }}
    {{- end }}
  ];
  const img = document.getElementById('error-emote');
  if (img && sadEmotes.length > 0) {
    img.src = sadEmotes[Math.floor(Math.random() * sadEmotes.length)];
  }
})();
</script>
{{ end }}
