<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Ad Break</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(5deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .star-animate {
      animation: float-star 6s ease-in-out infinite, twinkle 3s ease-in-out infinite;
    }

    @keyframes heart-float-pulse {
      0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
      25% { transform: translateY(-8px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      50% { transform: translateY(-3px) rotate(-45deg) scale(1); opacity: 0.4; }
      75% { transform: translateY(-10px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      100% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
    }

    .heart-animate {
      animation: heart-float-pulse 6s ease-in-out infinite;
    }

    @keyframes float-x {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(10deg); }
    }

    .x-animate {
      animation: float-x 4s ease-in-out infinite;
    }

    @keyframes float-emote {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    .float-emote {
      animation: float-emote 4s ease-in-out infinite;
    }

    /* TV static effect */
    @keyframes static {
      0% { background-position: 0 0; }
      100% { background-position: 100% 100%; }
    }

    .tv-static {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      animation: static 0.5s steps(10) infinite;
    }

    /* Progress bar animation */
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    .ad-progress {
      animation: progress var(--duration, 30s) linear forwards;
    }

    /* Countdown pulse */
    @keyframes countdown-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .countdown-pulse {
      animation: countdown-pulse 1s ease-in-out infinite;
    }

    /* TV scanline effect */
    @keyframes scanline {
      0% { top: -100%; }
      100% { top: 100%; }
    }

    .scanline {
      position: absolute;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.1), transparent);
      animation: scanline 3s linear infinite;
      pointer-events: none;
    }

    /* Retro TV glow */
    @keyframes tv-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(147, 51, 234, 0.3), inset 0 0 60px rgba(147, 51, 234, 0.1); }
      50% { box-shadow: 0 0 50px rgba(147, 51, 234, 0.5), inset 0 0 80px rgba(147, 51, 234, 0.15); }
    }

    .tv-glow {
      animation: tv-glow 3s ease-in-out infinite;
    }

    /* Bouncing TV icon */
    @keyframes tv-bounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    .tv-bounce {
      animation: tv-bounce 2s ease-in-out infinite;
    }

    /* Dots animation */
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    .loading-dots::after {
      content: '...';
      animation: dots 1.5s steps(1, end) infinite;
      display: inline-block;
      width: 1.5em;
      text-align: left;
    }
  </style>
</head>
<body>
  <!-- Animated Sky Background -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-b from-purple-300 via-lavender-200 to-blush-100"></div>
    <div class="absolute inset-0 checker-overlay opacity-20"></div>

    <!-- Clouds -->
    <div class="cloud cloud-1" style="left: -200px;"></div>
    <div class="cloud cloud-1" style="left: 30%; animation-delay: -8s;"></div>
    <div class="cloud cloud-1" style="left: 70%; animation-delay: -15s;"></div>
    <div class="cloud cloud-2" style="left: -150px;"></div>
    <div class="cloud cloud-2" style="left: 50%; animation-delay: -18s;"></div>
    <div class="cloud cloud-3" style="left: -180px;"></div>
    <div class="cloud cloud-3" style="left: 20%; animation-delay: -25s;"></div>
    <div class="cloud cloud-3" style="left: 60%; animation-delay: -12s;"></div>

    <!-- Stars -->
    <div class="star-alt star-animate hidden sm:block" style="top: 10%; left: 5%;"></div>
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 15%; left: 92%; width: 14px; height: 14px; animation-delay: -1s, -0.5s;"></div>
    <div class="star-alt star-animate hidden sm:block" style="top: 75%; left: 8%; width: 10px; height: 10px; animation-delay: -2s, -1s;"></div>
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 85%; left: 90%; animation-delay: -3s, -1.5s;"></div>

    <!-- X marks -->
    <div class="x-mark x-animate hidden sm:block" style="top: 20%; left: 8%; font-size: 28px;">✖</div>
    <div class="x-mark x-animate hidden sm:block" style="top: 70%; left: 92%; font-size: 24px; animation-delay: -1s;">✖</div>

    <!-- Hearts -->
    <div class="heart-alt heart-animate hidden sm:block" style="top: 25%; left: 6%; width: 16px; height: 16px;"></div>
    <div class="heart-alt heart-animate hidden sm:block" style="top: 80%; left: 93%; width: 15px; height: 15px; animation-delay: -3s;"></div>

    <!-- Sparkles -->
    <div class="absolute top-[30%] left-[4%] w-2 h-2 bg-hotpink-400 rounded-full opacity-60 animate-pulse-soft hidden sm:block"></div>
    <div class="absolute top-[50%] left-[96%] w-2 h-2 bg-purple-400 rounded-full opacity-50 animate-pulse-soft hidden sm:block" style="animation-delay: 0.5s;"></div>
  </div>

  <!-- Main Content -->
  <div class="fixed inset-0 z-10 flex flex-col items-center justify-center">
    <!-- Floating emotes -->
    <div class="absolute top-[18%] left-[18%] float-emote hidden sm:block" style="animation-delay: -0.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 0).file) | relURL }}" class="w-10 sm:w-16 h-10 sm:h-16 object-contain opacity-60" alt="">
    </div>
    <div class="absolute top-[22%] right-[18%] float-emote" style="animation-delay: -1.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 1).file) | relURL }}" class="w-8 sm:w-14 h-8 sm:h-14 object-contain opacity-60" alt="">
    </div>
    <div class="absolute bottom-[22%] left-[15%] float-emote hidden sm:block" style="animation-delay: -2s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 2).file) | relURL }}" class="w-10 sm:w-16 h-10 sm:h-16 object-contain opacity-60" alt="">
    </div>
    <div class="absolute bottom-[18%] right-[15%] float-emote" style="animation-delay: -2.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 3).file) | relURL }}" class="w-8 sm:w-14 h-8 sm:h-14 object-contain opacity-60" alt="">
    </div>

    <!-- Main TV Card -->
    <div class="text-center relative px-4 sm:px-0">
      <div class="bg-white/90 backdrop-blur-sm border-4 border-alt-900 p-6 sm:p-10 shadow-hard relative tv-glow rounded-lg">
        <!-- Tape pieces -->
        <div class="absolute -top-3 left-4 sm:left-8 w-12 sm:w-16 h-5 sm:h-6 bg-hotpink-200/60 border border-hotpink-300/40" style="transform: rotate(-12deg);"></div>
        <div class="absolute -top-3 right-4 sm:right-8 w-12 sm:w-16 h-5 sm:h-6 bg-purple-200/60 border border-purple-300/40" style="transform: rotate(8deg);"></div>

        <!-- Scanline effect -->
        <div class="scanline"></div>

        <!-- TV Icon -->
        <div class="text-6xl sm:text-8xl mb-4 tv-bounce">📺</div>

        <!-- Main text -->
        <h1 class="font-display font-black text-3xl sm:text-5xl md:text-6xl text-alt-900 mb-2 sm:mb-4" style="text-shadow: 4px 4px 0 rgba(147,51,234,0.2);">
          AD BREAK
        </h1>

        <div class="bg-purple-400 text-white px-4 sm:px-6 py-1.5 sm:py-2 inline-block border-2 border-alt-900 shadow-hard mb-4 sm:mb-6">
          <p class="font-display font-bold text-sm sm:text-lg tracking-widest uppercase loading-dots">
            Quick commercial break
          </p>
        </div>

        <!-- Progress bar -->
        <div class="w-full max-w-xs mx-auto mb-4">
          <div class="h-3 bg-alt-200 rounded-full border-2 border-alt-900 overflow-hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-hotpink-400 to-purple-500 rounded-full ad-progress"></div>
          </div>
          <p class="font-body text-alt-500 text-xs sm:text-sm mt-2">
            <span id="countdown">~30</span> seconds remaining
          </p>
        </div>

        <!-- Cute message -->
        <p class="font-body text-alt-600 text-sm sm:text-lg">
          We'll be right back! <span class="text-hotpink-500">♡</span>
        </p>

        <!-- Decorative row -->
        <div class="flex items-center justify-center gap-2 sm:gap-3 mt-4 sm:mt-6 text-lg sm:text-2xl text-alt-300">
          <span>♡</span>
          <span class="hidden sm:inline">·</span>
          <span class="hidden sm:inline">☆</span>
          <span>·</span>
          <span>📺</span>
          <span>·</span>
          <span class="hidden sm:inline">☆</span>
          <span class="hidden sm:inline">·</span>
          <span>♡</span>
        </div>
      </div>
    </div>

    <!-- Bottom socials -->
    <div class="absolute bottom-4 sm:bottom-12 left-0 right-0 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-3 px-4">
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-[#9146FF] text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-alt-900 shadow-hard min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400 text-lg hidden sm:inline">♡</span>
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-[#FF0000] text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-alt-900 shadow-hard min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400 text-lg hidden sm:inline">♡</span>
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-alt-900 text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-alt-900 shadow-hard min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
    </div>
  </div>

  <script>
    // Get duration from URL params (default 30 seconds)
    const params = new URLSearchParams(window.location.search);
    const duration = parseInt(params.get('duration')) || 30;

    // Set CSS variable for progress bar animation
    document.getElementById('progress-bar').style.setProperty('--duration', duration + 's');

    // Countdown timer
    let remaining = duration;
    const countdownEl = document.getElementById('countdown');

    function updateCountdown() {
      countdownEl.textContent = '~' + remaining;
      if (remaining > 0) {
        remaining--;
        setTimeout(updateCountdown, 1000);
      }
    }

    updateCountdown();
  </script>
</body>
</html>
