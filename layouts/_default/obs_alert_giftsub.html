<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gift Sub Alert</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .alert-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Gift box */
    .gift-box {
      position: relative;
      width: 140px;
      height: 120px;
      opacity: 0;
      transform: translateY(-50px);
      animation: box-drop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
    }

    @keyframes box-drop {
      0% {
        opacity: 0;
        transform: translateY(-100px) rotate(-10deg);
      }
      60% {
        transform: translateY(10px) rotate(5deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
      }
    }

    /* Box body */
    .gift-box-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 80px;
      background: linear-gradient(135deg, #FF1493 0%, #ff69b4 100%);
      border-radius: 10px;
      border: 3px solid #fff;
      box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
    }

    /* Ribbon vertical */
    .gift-box-body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 25px;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
      border-left: 2px solid rgba(255, 255, 255, 0.3);
      border-right: 2px solid rgba(255, 255, 255, 0.3);
    }

    /* Box lid */
    .gift-box-lid {
      position: absolute;
      top: 0;
      left: -10px;
      width: calc(100% + 20px);
      height: 35px;
      background: linear-gradient(135deg, #FF1493 0%, #ff69b4 100%);
      border-radius: 8px;
      border: 3px solid #fff;
      transform-origin: bottom center;
      animation: lid-open 0.5s ease-out 1s forwards;
    }

    .gift-box-lid::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 30px;
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #FFA500);
    }

    @keyframes lid-open {
      0% { transform: rotateX(0deg) translateY(0); }
      100% { transform: rotateX(-120deg) translateY(-20px); }
    }

    /* Bow */
    .gift-bow {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 50px;
      z-index: 10;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    /* Exploding gifts */
    .mini-gift {
      position: absolute;
      font-size: 32px;
      opacity: 0;
    }

    .mini-gift.explode {
      animation: gift-explode 1s ease-out forwards;
    }

    @keyframes gift-explode {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.5) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot));
      }
    }

    /* Text */
    .gift-text {
      margin-top: 30px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: text-reveal 0.5s ease-out 1.3s forwards;
    }

    @keyframes text-reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gift-label {
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .gift-name {
      font-family: 'Quicksand', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 4px 20px rgba(255, 20, 147, 0.5);
      margin-top: 5px;
    }

    .gift-count {
      font-family: 'Quicksand', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #FFD700;
      margin-top: 8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Hearts floating up */
    .floating-heart {
      position: fixed;
      font-size: 24px;
      opacity: 0;
      animation: heart-rise 2s ease-out forwards;
    }

    @keyframes heart-rise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0);
      }
      20% {
        opacity: 1;
        transform: translateY(-20px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-200px) scale(0.5);
      }
    }

    /* Sparkles */
    .sparkle {
      position: fixed;
      font-size: 20px;
      opacity: 0;
      animation: sparkle-pop 0.8s ease-out forwards;
    }

    @keyframes sparkle-pop {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(0.8); }
    }

    /* Fade out */
    @keyframes fade-out {
      to { opacity: 0; }
    }

    .alert-container.fade-out {
      animation: fade-out 0.5s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="alert-container">
    <!-- Gift box -->
    <div class="gift-box">
      <div class="gift-bow">🎀</div>
      <div class="gift-box-lid"></div>
      <div class="gift-box-body"></div>

      <!-- Mini gifts that explode out -->
      <div class="mini-gift" id="mini-1" style="--tx: -120px; --ty: -150px; --rot: -30deg;">🎁</div>
      <div class="mini-gift" id="mini-2" style="--tx: -80px; --ty: -180px; --rot: 20deg;">🎁</div>
      <div class="mini-gift" id="mini-3" style="--tx: 0px; --ty: -200px; --rot: 0deg;">🎁</div>
      <div class="mini-gift" id="mini-4" style="--tx: 80px; --ty: -180px; --rot: -20deg;">🎁</div>
      <div class="mini-gift" id="mini-5" style="--tx: 120px; --ty: -150px; --rot: 30deg;">🎁</div>
    </div>

    <!-- Text -->
    <div class="gift-text">
      <div class="gift-label">Gift Bomb!</div>
      <div class="gift-name" id="gifter-name">GenerousViewer</div>
      <div class="gift-count">gifted <span id="gift-count">5</span> subs!</div>
    </div>

    <!-- Floating hearts -->
    <div class="floating-heart" style="left: 15%; animation-delay: 1.2s;">💖</div>
    <div class="floating-heart" style="left: 30%; animation-delay: 1.4s;">💕</div>
    <div class="floating-heart" style="left: 50%; animation-delay: 1.3s;">💗</div>
    <div class="floating-heart" style="left: 70%; animation-delay: 1.5s;">💖</div>
    <div class="floating-heart" style="left: 85%; animation-delay: 1.25s;">💕</div>

    <!-- Sparkles -->
    <div class="sparkle" style="top: 20%; left: 10%; animation-delay: 1.1s;">✨</div>
    <div class="sparkle" style="top: 30%; right: 15%; animation-delay: 1.2s;">⭐</div>
    <div class="sparkle" style="top: 50%; left: 5%; animation-delay: 1.3s;">✨</div>
    <div class="sparkle" style="top: 60%; right: 10%; animation-delay: 1.4s;">🌟</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // Gifter name
    const name = params.get('name') || 'Anonymous';
    document.getElementById('gifter-name').textContent = name;

    // Gift count
    const count = params.get('count') || '1';
    document.getElementById('gift-count').textContent = count;

    // Trigger mini gift explosion after lid opens
    setTimeout(() => {
      document.querySelectorAll('.mini-gift').forEach(gift => {
        gift.classList.add('explode');
      });
    }, 1000);

    // Fade out after duration
    const duration = parseInt(params.get('duration')) || 6;
    if (duration > 0) {
      setTimeout(() => {
        document.querySelector('.alert-container').classList.add('fade-out');
      }, duration * 1000);
    }
  </script>
</body>
</html>
