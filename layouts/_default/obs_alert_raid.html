<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Raid Alert</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .alert-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: container-in 0.5s ease-out 0.2s forwards;
    }

    @keyframes container-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Main banner */
    .raid-banner {
      background: linear-gradient(135deg, #9146FF 0%, #ff1493 100%);
      padding: 20px 60px;
      border-radius: 20px;
      border: 4px solid #fff;
      box-shadow: 0 10px 40px rgba(145, 70, 255, 0.5), 0 0 60px rgba(255, 20, 147, 0.3);
      text-align: center;
      transform: scale(0) rotate(-10deg);
      animation: banner-pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
      position: relative;
      z-index: 10;
    }

    @keyframes banner-pop {
      0% { transform: scale(0) rotate(-10deg); }
      70% { transform: scale(1.1) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .raid-title {
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .raid-name {
      font-family: 'Quicksand', sans-serif;
      font-size: 42px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 8px;
    }

    .raid-count {
      font-family: 'Quicksand', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
    }

    .raid-count span {
      font-weight: 700;
      color: #fff;
      font-size: 24px;
    }

    /* Marching emotes */
    .emote-army {
      position: fixed;
      bottom: 20%;
      left: 0;
      right: 0;
      height: 80px;
      display: flex;
      justify-content: center;
      gap: 10px;
      z-index: 5;
    }

    .marching-emote {
      font-size: 48px;
      opacity: 0;
      animation: march-in 0.8s ease-out forwards, bounce-march 0.4s ease-in-out infinite;
    }

    @keyframes march-in {
      0% {
        opacity: 0;
        transform: translateX(-200px) translateY(50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0) translateY(0);
      }
    }

    @keyframes bounce-march {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    /* Stagger the emotes */
    .marching-emote:nth-child(1) { animation-delay: 0.5s, 0.5s; }
    .marching-emote:nth-child(2) { animation-delay: 0.6s, 0.6s; }
    .marching-emote:nth-child(3) { animation-delay: 0.7s, 0.7s; }
    .marching-emote:nth-child(4) { animation-delay: 0.8s, 0.8s; }
    .marching-emote:nth-child(5) { animation-delay: 0.9s, 0.9s; }
    .marching-emote:nth-child(6) { animation-delay: 1.0s, 1.0s; }
    .marching-emote:nth-child(7) { animation-delay: 1.1s, 1.1s; }

    /* Flying emotes from sides */
    .flying-emote {
      position: fixed;
      font-size: 32px;
      opacity: 0;
      animation: fly-across 2s ease-out forwards;
    }

    @keyframes fly-across {
      0% {
        opacity: 0;
        transform: translateX(-100vw) rotate(0deg);
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateX(100vw) rotate(360deg);
      }
    }

    /* Sparkle bursts */
    .sparkle {
      position: fixed;
      font-size: 24px;
      opacity: 0;
      animation: sparkle-burst 1s ease-out forwards;
    }

    @keyframes sparkle-burst {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      50% {
        opacity: 1;
        transform: scale(1.5);
      }
      100% {
        opacity: 0;
        transform: scale(0.5);
      }
    }

    /* Fade out */
    @keyframes fade-out {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    .alert-container.fade-out {
      animation: fade-out 0.5s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="alert-container">
    <!-- Main banner -->
    <div class="raid-banner">
      <div class="raid-title">Incoming Raid!</div>
      <div class="raid-name" id="raider-name">StreamerName</div>
      <div class="raid-count">with <span id="viewer-count">100</span> viewers!</div>
    </div>

    <!-- Marching emotes -->
    <div class="emote-army">
      <div class="marching-emote">🎮</div>
      <div class="marching-emote">⚔️</div>
      <div class="marching-emote">🛡️</div>
      <div class="marching-emote">👑</div>
      <div class="marching-emote">🛡️</div>
      <div class="marching-emote">⚔️</div>
      <div class="marching-emote">🎮</div>
    </div>

    <!-- Flying emotes -->
    <div class="flying-emote" style="top: 20%; animation-delay: 0.8s;">💜</div>
    <div class="flying-emote" style="top: 35%; animation-delay: 1.0s;">✨</div>
    <div class="flying-emote" style="top: 50%; animation-delay: 1.2s;">💜</div>
    <div class="flying-emote" style="top: 65%; animation-delay: 1.4s;">⭐</div>

    <!-- Sparkles -->
    <div class="sparkle" style="top: 15%; left: 10%; animation-delay: 0.5s;">✨</div>
    <div class="sparkle" style="top: 25%; right: 15%; animation-delay: 0.7s;">⭐</div>
    <div class="sparkle" style="top: 60%; left: 20%; animation-delay: 0.9s;">✨</div>
    <div class="sparkle" style="top: 70%; right: 10%; animation-delay: 1.1s;">💫</div>
    <div class="sparkle" style="top: 40%; left: 5%; animation-delay: 1.3s;">⭐</div>
    <div class="sparkle" style="top: 80%; right: 25%; animation-delay: 1.5s;">✨</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // Raider name
    const name = params.get('name') || 'Someone Awesome';
    document.getElementById('raider-name').textContent = name;

    // Viewer count
    const viewers = params.get('viewers') || '???';
    document.getElementById('viewer-count').textContent = viewers;

    // Fade out after duration
    const duration = parseInt(params.get('duration')) || 6;
    if (duration > 0) {
      setTimeout(() => {
        document.querySelector('.alert-container').classList.add('fade-out');
      }, duration * 1000);
    }
  </script>
</body>
</html>
