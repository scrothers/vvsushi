<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Channel Points Redemption Alert</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .alert-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Channel point icon */
    .point-icon {
      width: 100px;
      height: 100px;
      position: relative;
      opacity: 0;
      transform: scale(0) rotate(-180deg);
      animation: icon-spin-in 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
    }

    .point-icon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #9146FF 0%, #B362FF 50%, #9146FF 100%);
      border-radius: 50%;
      animation: icon-pulse 1.5s ease-in-out infinite;
    }

    .point-icon::after {
      content: '';
      position: absolute;
      top: 20%;
      left: 20%;
      right: 20%;
      bottom: 20%;
      background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, transparent 60%);
      border-radius: 50%;
    }

    .point-icon-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      z-index: 1;
    }

    @keyframes icon-spin-in {
      0% { opacity: 0; transform: scale(0) rotate(-180deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes icon-pulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(145, 70, 255, 0.6), 0 0 40px rgba(145, 70, 255, 0.3);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 30px rgba(145, 70, 255, 0.8), 0 0 60px rgba(145, 70, 255, 0.4);
        transform: scale(1.05);
      }
    }

    /* Reward card */
    .reward-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.9) 100%);
      padding: 25px 40px;
      border-radius: 20px;
      margin-top: 20px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(145, 70, 255, 0.3), 0 0 0 4px #9146FF;
      opacity: 0;
      transform: translateY(30px);
      animation: card-slide-up 0.5s ease-out 0.7s forwards;
    }

    @keyframes card-slide-up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reward-label {
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #9146FF;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .reward-name {
      font-family: 'Quicksand', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin-bottom: 15px;
    }

    .reward-divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #9146FF, #ff1493);
      margin: 0 auto 15px;
      border-radius: 2px;
    }

    .reward-user {
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #666;
    }

    .reward-user span {
      color: #9146FF;
      font-weight: 700;
    }

    /* Cost badge */
    .cost-badge {
      position: absolute;
      top: -15px;
      right: -15px;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      padding: 8px 15px;
      border-radius: 20px;
      border: 3px solid #fff;
      box-shadow: 0 4px 15px rgba(255, 165, 0, 0.4);
      opacity: 0;
      transform: scale(0);
      animation: badge-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s forwards;
    }

    .cost-badge span {
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #333;
    }

    @keyframes badge-pop {
      0% { opacity: 0; transform: scale(0); }
      70% { transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Orbiting points */
    .orbit {
      position: absolute;
      width: 200px;
      height: 200px;
      border: 2px dashed rgba(145, 70, 255, 0.2);
      border-radius: 50%;
      animation: orbit-spin 8s linear infinite;
      opacity: 0;
      animation: orbit-appear 0.5s ease-out 0.5s forwards, orbit-spin 8s linear 0.5s infinite;
    }

    @keyframes orbit-appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orbit-point {
      position: absolute;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #9146FF, #B362FF);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(145, 70, 255, 0.5);
    }

    .orbit-point:nth-child(1) { top: -10px; left: 50%; transform: translateX(-50%); }
    .orbit-point:nth-child(2) { bottom: -10px; left: 50%; transform: translateX(-50%); }
    .orbit-point:nth-child(3) { left: -10px; top: 50%; transform: translateY(-50%); }
    .orbit-point:nth-child(4) { right: -10px; top: 50%; transform: translateY(-50%); }

    /* Flying points */
    .flying-point {
      position: fixed;
      width: 15px;
      height: 15px;
      background: linear-gradient(135deg, #9146FF, #B362FF);
      border-radius: 50%;
      opacity: 0;
      animation: point-fly 1.5s ease-out forwards;
    }

    @keyframes point-fly {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0);
      }
      20% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.5);
      }
    }

    /* Sparkles */
    .sparkle {
      position: fixed;
      font-size: 24px;
      opacity: 0;
      animation: sparkle-pop 1s ease-out forwards;
    }

    @keyframes sparkle-pop {
      0% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
      100% { opacity: 0; transform: scale(0.8) rotate(360deg); }
    }

    /* Card wrapper for positioning */
    .card-wrapper {
      position: relative;
    }

    /* Fade out */
    @keyframes fade-out {
      to { opacity: 0; }
    }

    .alert-container.fade-out {
      animation: fade-out 0.5s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="alert-container">
    <!-- Orbiting points -->
    <div class="orbit">
      <div class="orbit-point"></div>
      <div class="orbit-point"></div>
      <div class="orbit-point"></div>
      <div class="orbit-point"></div>
    </div>

    <!-- Point icon -->
    <div class="point-icon">
      <div class="point-icon-inner">💎</div>
    </div>

    <!-- Reward card -->
    <div class="card-wrapper">
      <div class="reward-card">
        <div class="reward-label">Reward Redeemed!</div>
        <div class="reward-name" id="reward-name">Highlight My Message</div>
        <div class="reward-divider"></div>
        <div class="reward-user">by <span id="user-name">Viewer</span></div>
      </div>
      <div class="cost-badge">
        <span id="cost">500</span> pts
      </div>
    </div>

    <!-- Flying points -->
    <div class="flying-point" style="top: 50%; left: 50%; --tx: -150px; --ty: -100px; animation-delay: 0.8s;"></div>
    <div class="flying-point" style="top: 50%; left: 50%; --tx: 150px; --ty: -80px; animation-delay: 0.9s;"></div>
    <div class="flying-point" style="top: 50%; left: 50%; --tx: -120px; --ty: 120px; animation-delay: 1.0s;"></div>
    <div class="flying-point" style="top: 50%; left: 50%; --tx: 140px; --ty: 100px; animation-delay: 1.1s;"></div>
    <div class="flying-point" style="top: 50%; left: 50%; --tx: -80px; --ty: -150px; animation-delay: 1.2s;"></div>
    <div class="flying-point" style="top: 50%; left: 50%; --tx: 100px; --ty: 140px; animation-delay: 1.3s;"></div>

    <!-- Sparkles -->
    <div class="sparkle" style="top: 15%; left: 20%; animation-delay: 0.9s;">✨</div>
    <div class="sparkle" style="top: 20%; right: 25%; animation-delay: 1.0s;">⭐</div>
    <div class="sparkle" style="top: 70%; left: 15%; animation-delay: 1.1s;">💜</div>
    <div class="sparkle" style="top: 75%; right: 20%; animation-delay: 1.2s;">✨</div>
    <div class="sparkle" style="top: 40%; left: 10%; animation-delay: 1.3s;">⭐</div>
    <div class="sparkle" style="top: 60%; right: 10%; animation-delay: 1.4s;">💜</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // Reward name
    const reward = params.get('reward') || 'Reward';
    document.getElementById('reward-name').textContent = reward;

    // User name
    const name = params.get('name') || 'Viewer';
    document.getElementById('user-name').textContent = name;

    // Cost (optional)
    const cost = params.get('cost');
    if (cost) {
      document.getElementById('cost').textContent = cost;
    } else {
      document.querySelector('.cost-badge').style.display = 'none';
    }

    // Fade out after duration
    const duration = parseInt(params.get('duration')) || 5;
    if (duration > 0) {
      setTimeout(() => {
        document.querySelector('.alert-container').classList.add('fade-out');
      }, duration * 1000);
    }
  </script>
</body>
</html>
