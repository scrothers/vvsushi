<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>New Subscriber Alert</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .alert-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Camera */
    .camera {
      position: relative;
      width: 200px;
      height: 160px;
      background: linear-gradient(145deg, #2a2a2a 0%, #1a1a1a 100%);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(-100px) scale(0.8);
      animation: camera-drop 0.6s ease-out 0.2s forwards;
    }

    /* Camera lens */
    .camera::before {
      content: '';
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      background: linear-gradient(145deg, #3a3a3a, #1a1a1a);
      border-radius: 50%;
      border: 4px solid #444;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    /* Inner lens */
    .camera::after {
      content: '';
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background: linear-gradient(145deg, #1a1a3a, #0a0a1a);
      border-radius: 50%;
      border: 2px solid #333;
    }

    /* Flash unit */
    .camera-flash {
      position: absolute;
      top: 10px;
      right: 20px;
      width: 30px;
      height: 20px;
      background: linear-gradient(145deg, #666, #444);
      border-radius: 4px;
    }

    /* Viewfinder */
    .camera-viewfinder {
      position: absolute;
      top: 10px;
      left: 20px;
      width: 25px;
      height: 15px;
      background: #222;
      border-radius: 3px;
      border: 2px solid #444;
    }

    /* Rainbow stripe */
    .camera-stripe {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 8px;
      background: linear-gradient(90deg,
        #ff6b6b 0%, #ff6b6b 20%,
        #ffd93d 20%, #ffd93d 40%,
        #6bcb77 40%, #6bcb77 60%,
        #4d96ff 60%, #4d96ff 80%,
        #9b59b6 80%, #9b59b6 100%
      );
      border-radius: 2px;
    }

    /* Photo slot */
    .camera-slot {
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 10px;
      background: #111;
      border-radius: 0 0 5px 5px;
    }

    /* Flash effect overlay */
    .flash-overlay {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      animation: flash 0.3s ease-out 1.2s forwards;
    }

    /* The polaroid photo */
    .polaroid-photo {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      background: white;
      padding: 10px;
      padding-bottom: 50px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      opacity: 0;
      animation: photo-print 1s ease-out 1.5s forwards;
    }

    /* Photo image area */
    .photo-image {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #ff69b4 0%, #8b8bb8 50%, #87ceeb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Sparkle overlay on photo */
    .photo-image::before {
      content: '✨';
      position: absolute;
      font-size: 40px;
      animation: sparkle-rotate 2s ease-in-out infinite;
    }

    /* Photo text area */
    .photo-text {
      text-align: center;
      padding-top: 12px;
    }

    .photo-label {
      font-family: 'Quicksand', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #ff1493;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .photo-name {
      font-family: 'Quicksand', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #2a2a2a;
      word-break: break-word;
    }

    /* Camera shake before flash */
    @keyframes camera-drop {
      0% {
        opacity: 0;
        transform: translateY(-100px) scale(0.8);
      }
      60% {
        opacity: 1;
        transform: translateY(10px) scale(1.05);
      }
      80% {
        transform: translateY(-5px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Shake animation */
    .camera.shake {
      animation: camera-drop 0.6s ease-out 0.2s forwards,
                 camera-shake 0.1s ease-in-out 1s 3;
    }

    @keyframes camera-shake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-3px) rotate(-1deg); }
      75% { transform: translateX(3px) rotate(1deg); }
    }

    /* Flash animation */
    @keyframes flash {
      0% { opacity: 0; }
      20% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* Photo printing out */
    @keyframes photo-print {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(0);
      }
      30% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(40px) rotate(-3deg);
      }
    }

    /* Sparkle rotation */
    @keyframes sparkle-rotate {
      0%, 100% { transform: rotate(-10deg) scale(1); }
      50% { transform: rotate(10deg) scale(1.1); }
    }

    /* Photo gentle float after printing */
    .polaroid-photo.printed {
      animation: photo-print 1s ease-out 1.5s forwards,
                 photo-float 3s ease-in-out 2.5s infinite;
    }

    @keyframes photo-float {
      0%, 100% { transform: translateX(-50%) translateY(40px) rotate(-3deg); }
      50% { transform: translateX(-50%) translateY(35px) rotate(-1deg); }
    }

    /* Stars around camera */
    .deco-star {
      position: absolute;
      font-size: 24px;
      opacity: 0;
      animation: star-pop 0.5s ease-out forwards;
    }

    @keyframes star-pop {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }

    .star-1 { top: -20px; left: -30px; animation-delay: 0.8s; }
    .star-2 { top: -25px; right: -25px; animation-delay: 0.9s; }
    .star-3 { top: 50%; left: -40px; animation-delay: 1s; }
    .star-4 { top: 50%; right: -35px; animation-delay: 1.1s; }

    /* Hearts that float up */
    .floating-hearts {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      animation: heart-float 2s ease-out forwards;
    }

    @keyframes heart-float {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0);
      }
      20% {
        opacity: 1;
        transform: translateY(-20px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-150px) scale(0.5);
      }
    }

    .heart:nth-child(1) { left: -60px; animation-delay: 1.3s; }
    .heart:nth-child(2) { left: -30px; animation-delay: 1.5s; }
    .heart:nth-child(3) { left: 10px; animation-delay: 1.4s; }
    .heart:nth-child(4) { left: 40px; animation-delay: 1.6s; }
    .heart:nth-child(5) { left: 70px; animation-delay: 1.35s; }

    /* Fade out animation */
    @keyframes fade-out {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.9); }
    }

    .alert-container.fade-out {
      animation: fade-out 0.5s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="alert-container">
    <!-- Floating hearts -->
    <div class="floating-hearts">
      <div class="heart">💖</div>
      <div class="heart">💕</div>
      <div class="heart">💗</div>
      <div class="heart">💖</div>
      <div class="heart">💕</div>
    </div>

    <!-- Camera -->
    <div class="camera shake">
      <div class="camera-flash"></div>
      <div class="camera-viewfinder"></div>
      <div class="camera-stripe"></div>
      <div class="camera-slot"></div>

      <!-- Decorative stars -->
      <div class="deco-star star-1">⭐</div>
      <div class="deco-star star-2">✨</div>
      <div class="deco-star star-3">🌟</div>
      <div class="deco-star star-4">✨</div>

      <!-- Photo that prints out -->
      <div class="polaroid-photo printed">
        <div class="photo-image"></div>
        <div class="photo-text">
          <div class="photo-label">New Subscriber!</div>
          <div class="photo-name" id="sub-name">Username</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Flash overlay -->
  <div class="flash-overlay"></div>

  <script>
    // Get URL parameters
    const params = new URLSearchParams(window.location.search);

    // Subscriber name
    const name = params.get('name') || 'Someone Amazing';
    document.getElementById('sub-name').textContent = name;

    // Optional: Custom label
    const label = params.get('label');
    if (label) {
      document.querySelector('.photo-label').textContent = label;
    }

    // Fade out after duration (default 5 seconds)
    const duration = parseInt(params.get('duration')) || 5;
    if (duration > 0) {
      setTimeout(() => {
        document.querySelector('.alert-container').classList.add('fade-out');
      }, duration * 1000);
    }
  </script>
</body>
</html>
