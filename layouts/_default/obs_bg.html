<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>OBS Background</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Floating animation for stars */
    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(5deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(3deg); }
    }

    /* Twinkle animation for stars */
    @keyframes twinkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* Combined float and twinkle for stars */
    .star-animate {
      animation: float-star 6s ease-in-out infinite, twinkle 3s ease-in-out infinite;
    }

    /* Combined float and pulse animation for hearts */
    @keyframes heart-float-pulse {
      0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
      12.5% { transform: translateY(-4px) rotate(-47deg) scale(1.08); opacity: 0.5; }
      25% { transform: translateY(-8px) rotate(-45deg) scale(1); opacity: 0.4; }
      37.5% { transform: translateY(-6px) rotate(-43deg) scale(1.08); opacity: 0.5; }
      50% { transform: translateY(-3px) rotate(-45deg) scale(1); opacity: 0.4; }
      62.5% { transform: translateY(-7px) rotate(-47deg) scale(1.08); opacity: 0.5; }
      75% { transform: translateY(-10px) rotate(-45deg) scale(1); opacity: 0.4; }
      87.5% { transform: translateY(-5px) rotate(-43deg) scale(1.08); opacity: 0.5; }
      100% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
    }

    .heart-animate {
      animation: heart-float-pulse 6s ease-in-out infinite;
    }

    /* Fix heart scaling - make pseudo-elements match parent size */
    .heart-alt::before,
    .heart-alt::after {
      width: inherit;
      height: inherit;
    }

    .heart-alt::before {
      top: -50%;
      left: 0;
    }

    .heart-alt::after {
      top: 0;
      left: 50%;
    }

    /* Floating X marks */
    @keyframes float-x {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(10deg); }
    }

    .x-animate {
      animation: float-x 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Animated Sky Background with Alt Elements - Same as main site -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <!-- Gradient sky background -->
    <div class="absolute inset-0 bg-gradient-to-b from-skyblue-100 via-lavender-50 to-blush-100"></div>

    <!-- Subtle checker overlay for alt vibe -->
    <div class="absolute inset-0 checker-overlay opacity-30"></div>

    <!-- Clouds Layer 1 (Foreground - faster) -->
    <div class="cloud cloud-1" style="left: -200px;"></div>
    <div class="cloud cloud-1" style="left: 30%; animation-delay: -8s;"></div>
    <div class="cloud cloud-1" style="left: 70%; animation-delay: -15s;"></div>

    <!-- Clouds Layer 2 (Midground) -->
    <div class="cloud cloud-2" style="left: -150px;"></div>
    <div class="cloud cloud-2" style="left: 50%; animation-delay: -18s;"></div>

    <!-- Clouds Layer 3 (Background - slower) -->
    <div class="cloud cloud-3" style="left: -180px;"></div>
    <div class="cloud cloud-3" style="left: 20%; animation-delay: -25s;"></div>
    <div class="cloud cloud-3" style="left: 60%; animation-delay: -12s;"></div>

    <!-- Alt decorative elements - Animated Stars -->
    <div class="star-alt star-animate" style="top: 15%; left: 8%; animation-delay: 0s, 0s;"></div>

    <div class="star-alt star-animate" style="top: 80%; left: 12%; width: 8px; height: 8px; animation-delay: -4s, -2s;"></div>

    <!-- Extra animated stars -->
    <div class="star-alt star-animate" style="top: 10%; left: 45%; width: 10px; height: 10px; animation-delay: -2.5s, -1.2s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 55%; left: 75%; width: 12px; height: 12px; animation-delay: -3.5s, -1.8s;"></div>
    <div class="star-alt star-animate" style="top: 70%; left: 30%; animation-delay: -0.5s, -0.3s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 90%; left: 60%; width: 8px; height: 8px; animation-delay: -4.5s, -2.2s;"></div>
    <div class="star-alt star-animate" style="top: 5%; left: 70%; width: 11px; height: 11px; animation-delay: -1.8s, -0.9s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 38%; left: 52%; width: 9px; height: 9px; animation-delay: -2.8s, -1.4s;"></div>
    <div class="star-alt star-animate" style="top: 72%; left: 15%; width: 13px; height: 13px; animation-delay: -3.8s, -1.9s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 18%; left: 28%; width: 10px; height: 10px; animation-delay: -0.8s, -0.4s;"></div>

    <!-- Animated X marks -->
    <div class="x-mark x-animate" style="top: 20%; left: 85%; animation-delay: 0s;">✖</div>
    <div class="x-mark x-animate" style="top: 55%; left: 3%; font-size: 18px; animation-delay: -1s;">✖</div>
    <div class="x-mark x-animate" style="top: 75%; left: 90%; font-size: 32px; animation-delay: -2s;">✖</div>
    <div class="x-mark x-animate" style="top: 40%; left: 7%; font-size: 20px; animation-delay: -1.5s;">✖</div>
    <div class="x-mark x-animate" style="top: 8%; left: 55%; font-size: 16px; animation-delay: -2.5s;">✖</div>
    <div class="x-mark x-animate" style="top: 85%; left: 40%; font-size: 28px; animation-delay: -0.5s;">✖</div>
    <div class="x-mark x-animate" style="top: 30%; left: 70%; font-size: 22px; animation-delay: -3s;">✖</div>
    <div class="x-mark x-animate" style="top: 62%; left: 48%; font-size: 19px; animation-delay: -1.8s;">✖</div>
    <div class="x-mark x-animate" style="top: 48%; left: 25%; font-size: 24px; animation-delay: -2.3s;">✖</div>

    <!-- Animated Hearts -->
    <div class="heart-alt heart-animate" style="top: 12%; left: 78%;"></div>
    <div class="heart-alt heart-animate" style="top: 58%; left: 94%; width: 12px; height: 12px; animation-delay: -1.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 85%; left: 6%; animation-delay: -2.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 22%; left: 35%; width: 14px; height: 14px; animation-delay: -0.8s;"></div>
    <div class="heart-alt heart-animate" style="top: 68%; left: 55%; width: 10px; height: 10px; animation-delay: -3s;"></div>
    <div class="heart-alt heart-animate" style="top: 42%; left: 82%; animation-delay: -1.2s;"></div>
    <div class="heart-alt heart-animate" style="top: 92%; left: 25%; width: 12px; height: 12px; animation-delay: -2s;"></div>
    <div class="heart-alt heart-animate" style="top: 8%; left: 18%; width: 11px; height: 11px; animation-delay: -3.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 52%; left: 38%; width: 13px; height: 13px; animation-delay: -0.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 78%; left: 68%; width: 15px; height: 15px; animation-delay: -2.8s;"></div>
    <div class="heart-alt heart-animate" style="top: 33%; left: 12%; width: 10px; height: 10px; animation-delay: -1.8s;"></div>

    <!-- Small sparkle dots -->
    <div class="absolute top-[18%] left-[15%] w-1.5 h-1.5 bg-hotpink-400 rounded-full opacity-60 animate-pulse-soft"></div>
    <div class="absolute top-[32%] left-[82%] w-2 h-2 bg-purple-400 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 0.5s;"></div>
    <div class="absolute top-[48%] left-[4%] w-1 h-1 bg-hotpink-500 rounded-full opacity-40 animate-pulse-soft" style="animation-delay: 1s;"></div>
    <div class="absolute top-[62%] left-[91%] w-1.5 h-1.5 bg-periwinkle-500 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 1.5s;"></div>
    <div class="absolute top-[78%] left-[18%] w-2 h-2 bg-hotpink-400 rounded-full opacity-45 animate-pulse-soft" style="animation-delay: 2s;"></div>
    <div class="absolute top-[8%] left-[42%] w-1.5 h-1.5 bg-purple-400 rounded-full opacity-55 animate-pulse-soft" style="animation-delay: 0.3s;"></div>
    <div class="absolute top-[25%] left-[58%] w-2 h-2 bg-hotpink-400 rounded-full opacity-45 animate-pulse-soft" style="animation-delay: 0.8s;"></div>
    <div class="absolute top-[38%] left-[25%] w-1 h-1 bg-periwinkle-500 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 1.3s;"></div>
    <div class="absolute top-[52%] left-[68%] w-1.5 h-1.5 bg-purple-500 rounded-full opacity-40 animate-pulse-soft" style="animation-delay: 1.8s;"></div>
    <div class="absolute top-[72%] left-[45%] w-2 h-2 bg-hotpink-500 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 2.3s;"></div>
    <div class="absolute top-[88%] left-[72%] w-1.5 h-1.5 bg-periwinkle-400 rounded-full opacity-55 animate-pulse-soft" style="animation-delay: 0.6s;"></div>
    <div class="absolute top-[95%] left-[38%] w-1 h-1 bg-purple-400 rounded-full opacity-45 animate-pulse-soft" style="animation-delay: 1.1s;"></div>
  </div>
</body>
</html>
