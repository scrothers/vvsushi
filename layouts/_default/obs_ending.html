<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Stream Ending</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(5deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .star-animate {
      animation: float-star 6s ease-in-out infinite, twinkle 3s ease-in-out infinite;
    }

    @keyframes heart-float-pulse {
      0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
      25% { transform: translateY(-8px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      50% { transform: translateY(-3px) rotate(-45deg) scale(1); opacity: 0.4; }
      75% { transform: translateY(-10px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      100% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
    }

    .heart-animate {
      animation: heart-float-pulse 6s ease-in-out infinite;
    }

    .heart-alt::before, .heart-alt::after {
      width: inherit;
      height: inherit;
    }
    .heart-alt::before { top: -50%; left: 0; }
    .heart-alt::after { top: 0; left: 50%; }

    @keyframes float-x {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(10deg); }
    }

    .x-animate {
      animation: float-x 4s ease-in-out infinite;
    }

    /* Goodbye animations */
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-20deg); }
    }

    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
    }

    @keyframes sparkle-burst {
      0% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
      100% { opacity: 0; transform: scale(0) rotate(360deg); }
    }

    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .wave {
      animation: wave 1s ease-in-out infinite;
      transform-origin: bottom center;
    }

    .float-up {
      animation: float-up 3s ease-out infinite;
    }

    .sparkle-burst {
      animation: sparkle-burst 2s ease-in-out infinite;
    }

    .gentle-bounce {
      animation: gentle-bounce 2s ease-in-out infinite;
    }

    @keyframes heart-rise {
      0% { opacity: 0; transform: translateY(20px) scale(0); }
      20% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(-40px) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(0.5); }
    }

    .heart-rise {
      animation: heart-rise 4s ease-out infinite;
    }

    @keyframes float-emote {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    .float-emote {
      animation: float-emote 4s ease-in-out infinite;
    }

    @keyframes rainbow-shift {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    .rainbow {
      animation: rainbow-shift 8s linear infinite;
    }
  </style>
</head>
<body>
  <!-- Animated Sky Background - Sunset/evening vibe -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-b from-hotpink-200 via-purple-100 to-periwinkle-200"></div>
    <div class="absolute inset-0 checker-overlay opacity-20"></div>

    <!-- Clouds -->
    <div class="cloud cloud-1" style="left: -200px;"></div>
    <div class="cloud cloud-1" style="left: 30%; animation-delay: -8s;"></div>
    <div class="cloud cloud-1" style="left: 70%; animation-delay: -15s;"></div>
    <div class="cloud cloud-2" style="left: -150px;"></div>
    <div class="cloud cloud-2" style="left: 50%; animation-delay: -18s;"></div>
    <div class="cloud cloud-3" style="left: -180px;"></div>
    <div class="cloud cloud-3" style="left: 20%; animation-delay: -25s;"></div>
    <div class="cloud cloud-3" style="left: 60%; animation-delay: -12s;"></div>

    <!-- Stars - hide ALL on mobile -->
    <div class="star-alt star-animate hidden sm:block" style="top: 8%; left: 5%;"></div>
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 12%; left: 92%; width: 14px; height: 14px; animation-delay: -1s, -0.5s;"></div>
    <div class="star-alt star-animate hidden sm:block" style="top: 75%; left: 8%; width: 10px; height: 10px; animation-delay: -2s, -1s;"></div>
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 82%; left: 90%; animation-delay: -3s, -1.5s;"></div>
    <div class="star-alt star-animate hidden sm:block" style="top: 45%; left: 3%; width: 12px; height: 12px; animation-delay: -1.5s, -0.8s;"></div>
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 55%; left: 96%; width: 11px; height: 11px; animation-delay: -2.5s, -1.2s;"></div>

    <!-- X marks - hide ALL on mobile -->
    <div class="x-mark x-animate hidden sm:block" style="top: 18%; left: 7%; font-size: 28px;">✖</div>
    <div class="x-mark x-animate hidden sm:block" style="top: 72%; left: 93%; font-size: 24px; animation-delay: -1s;">✖</div>
    <div class="x-mark x-animate hidden sm:block" style="top: 88%; left: 12%; font-size: 20px; animation-delay: -2s;">✖</div>

    <!-- Hearts - hide ALL on mobile -->
    <div class="heart-alt heart-animate hidden sm:block" style="top: 22%; left: 5%; width: 16px; height: 16px;"></div>
    <div class="heart-alt heart-animate hidden sm:block" style="top: 15%; left: 94%; width: 14px; height: 14px; animation-delay: -1.5s;"></div>
    <div class="heart-alt heart-animate hidden sm:block" style="top: 78%; left: 6%; width: 12px; height: 12px; animation-delay: -2.5s;"></div>
    <div class="heart-alt heart-animate hidden sm:block" style="top: 85%; left: 92%; width: 15px; height: 15px; animation-delay: -3s;"></div>

    <!-- Sparkles - hide ALL on mobile -->
    <div class="absolute top-[28%] left-[4%] w-2 h-2 bg-hotpink-400 rounded-full opacity-60 animate-pulse-soft hidden sm:block"></div>
    <div class="absolute top-[48%] left-[96%] w-2 h-2 bg-purple-400 rounded-full opacity-50 animate-pulse-soft hidden sm:block" style="animation-delay: 0.5s;"></div>
    <div class="absolute top-[68%] left-[5%] w-1.5 h-1.5 bg-periwinkle-500 rounded-full opacity-50 animate-pulse-soft hidden sm:block" style="animation-delay: 1s;"></div>
  </div>

  <!-- Rising hearts background effect - fewer on mobile -->
  <div class="fixed inset-0 z-5 pointer-events-none overflow-hidden">
    <div class="absolute bottom-0 left-[10%] text-2xl sm:text-4xl heart-rise" style="animation-delay: 0s;">💖</div>
    <div class="absolute bottom-0 left-[25%] text-xl sm:text-3xl heart-rise hidden sm:block" style="animation-delay: 0.8s;">💜</div>
    <div class="absolute bottom-0 left-[40%] text-3xl sm:text-5xl heart-rise" style="animation-delay: 1.6s;">💗</div>
    <div class="absolute bottom-0 left-[55%] text-xl sm:text-3xl heart-rise hidden sm:block" style="animation-delay: 2.4s;">💖</div>
    <div class="absolute bottom-0 left-[70%] text-2xl sm:text-4xl heart-rise" style="animation-delay: 3.2s;">💜</div>
    <div class="absolute bottom-0 left-[85%] text-xl sm:text-3xl heart-rise hidden sm:block" style="animation-delay: 0.4s;">💗</div>
    <div class="absolute bottom-0 left-[15%] text-lg sm:text-2xl heart-rise hidden sm:block" style="animation-delay: 1.2s;">♡</div>
    <div class="absolute bottom-0 left-[60%] text-lg sm:text-2xl heart-rise hidden sm:block" style="animation-delay: 2s;">♡</div>
    <div class="absolute bottom-0 left-[80%] text-lg sm:text-2xl heart-rise hidden sm:block" style="animation-delay: 2.8s;">♡</div>
  </div>

  <!-- Main Hero Content -->
  <div class="fixed inset-0 z-10 flex flex-col items-center justify-center">
    <!-- Floating emotes - smaller on mobile, hide some -->
    <div class="absolute top-[15%] left-[15%] float-emote hidden sm:block" style="animation-delay: -0.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 0).file) | relURL }}" class="w-12 sm:w-20 h-12 sm:h-20 object-contain" alt="">
    </div>
    <div class="absolute top-[18%] right-[15%] float-emote" style="animation-delay: -1.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 1).file) | relURL }}" class="w-8 sm:w-16 h-8 sm:h-16 object-contain" alt="">
    </div>
    <div class="absolute bottom-[25%] left-[12%] float-emote hidden sm:block" style="animation-delay: -2s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 2).file) | relURL }}" class="w-10 sm:w-18 h-10 sm:h-18 object-contain" alt="">
    </div>
    <div class="absolute bottom-[22%] right-[12%] float-emote" style="animation-delay: -2.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 3).file) | relURL }}" class="w-10 sm:w-20 h-10 sm:h-20 object-contain" alt="">
    </div>

    <!-- Central hero -->
    <div class="text-center relative px-4 sm:px-0">
      <!-- Big waving emote -->
      <div class="relative mb-4 sm:mb-8 inline-block">
        <div class="gentle-bounce">
          <img id="hero-emote" src="" class="w-28 sm:w-44 h-28 sm:h-44 object-contain mx-auto" alt="">
        </div>
        <!-- Waving hand -->
        <div class="absolute -top-1 sm:-top-2 -right-4 sm:-right-8 text-3xl sm:text-6xl wave">👋</div>
        <!-- Sparkles - smaller on mobile -->
        <span class="absolute -top-3 sm:-top-6 left-0 text-xl sm:text-3xl sparkle-burst">✨</span>
        <span class="absolute -bottom-2 sm:-bottom-4 -right-2 sm:-right-4 text-lg sm:text-2xl sparkle-burst" style="animation-delay: 0.7s;">⭐</span>
        <span class="absolute top-1/2 -left-4 sm:-left-8 text-lg sm:text-2xl sparkle-burst hidden sm:inline" style="animation-delay: 1.4s;">✨</span>
      </div>

      <!-- Main text -->
      <h1 class="font-display font-black text-4xl sm:text-6xl md:text-8xl text-alt-900 mb-1 sm:mb-2" style="text-shadow: 6px 6px 0 rgba(255,105,180,0.3);">
        THANKS FOR
      </h1>
      <h1 class="font-display font-black text-4xl sm:text-6xl md:text-8xl gradient-text mb-4 sm:mb-6" style="text-shadow: 4px 4px 0 rgba(0,0,0,0.1);">
        WATCHING!
      </h1>

      <!-- Sweet message box -->
      <div class="bg-white border-4 border-alt-900 px-6 sm:px-10 py-2 sm:py-4 shadow-hard inline-block mb-4 sm:mb-6">
        <p class="font-display font-bold text-lg sm:text-2xl text-alt-800">
          See you next time! <span class="rainbow inline-block">💖</span>
        </p>
      </div>

      <!-- Call to action -->
      <div class="flex flex-col items-center gap-2 sm:gap-3">
        <p class="font-body text-alt-600 text-sm sm:text-lg">
          Don't forget to follow for more streams~
        </p>
        <div class="flex items-center gap-1.5 sm:gap-2 text-xl sm:text-3xl">
          <span class="animate-bounce" style="animation-delay: 0s;">💜</span>
          <span class="animate-bounce" style="animation-delay: 0.15s;">✨</span>
          <span class="animate-bounce" style="animation-delay: 0.3s;">💖</span>
          <span class="animate-bounce hidden sm:inline" style="animation-delay: 0.45s;">⭐</span>
          <span class="animate-bounce hidden sm:inline" style="animation-delay: 0.6s;">💜</span>
        </div>
      </div>
    </div>

    <!-- Bottom socials - vertical on mobile, horizontal on desktop -->
    <div class="absolute bottom-4 sm:bottom-12 left-0 right-0 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-3 px-4">
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-[#9146FF] text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-alt-900 shadow-hard min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400 text-lg hidden sm:inline">♡</span>
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-[#FF0000] text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-alt-900 shadow-hard min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400 text-lg hidden sm:inline">♡</span>
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-alt-900 text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-alt-900 shadow-hard min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const emotes = [
        {{- range $i, $e := site.Data.emotes.emotes }}{{ if $i }},{{ end }}"{{ (printf "images/emotes/%s" $e.file) | relURL }}"{{ end }}
      ];
      const img = document.getElementById('hero-emote');
      if (img) img.src = emotes[Math.floor(Math.random() * emotes.length)];
    })();
  </script>
</body>
</html>
