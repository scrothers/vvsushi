<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>OBS Frame Overlay</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    /* Animations */
    @keyframes float-emote {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }

    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(5deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes pulse-soft {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }

    .emote-float {
      animation: float-emote 4s ease-in-out infinite;
    }

    .star-float {
      animation: float-star 6s ease-in-out infinite, twinkle 3s ease-in-out infinite;
    }

    /* REC indicator */
    @keyframes rec-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      color: #ff0000;
      text-shadow: 0 0 6px rgba(255, 0, 0, 0.5);
    }
    .rec-dot {
      width: 10px;
      height: 10px;
      background: #ff0000;
      border-radius: 50%;
      animation: rec-blink 1.5s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
    }

    /* Main polaroid frame - fills viewport */
    .main-polaroid {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .main-polaroid-inner {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * 16 / 9 * 1.05); /* Maintain aspect with bottom area */
      background: white;
      padding: 12px;
      padding-bottom: 80px; /* Space for bottom content */
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e5e5;
    }

    .main-cutout {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      border: 3px solid #f0f0f0;
    }

    /* Bottom area of polaroid */
    .polaroid-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
    }

    /* Tape decoration */
    .tape {
      position: absolute;
      width: 100px;
      height: 32px;
      background: rgba(255, 182, 193, 0.5);
      border: 1px solid rgba(255, 105, 180, 0.3);
      z-index: 30;
    }
    .tape-tl {
      top: -16px;
      left: 40px;
      transform: rotate(-12deg);
    }
    .tape-tr {
      top: -16px;
      right: 40px;
      transform: rotate(8deg);
    }

    /* Webcam positioning - relative to main cutout */
    .webcam-frame {
      position: absolute;
      z-index: 20;
    }
    .webcam-br { bottom: 16px; right: 16px; }
    .webcam-bl { bottom: 16px; left: 16px; }
    .webcam-tr { top: 16px; right: 16px; }
    .webcam-tl { top: 16px; left: 16px; }

    /* Webcam sizes */
    .webcam-sm .webcam-cutout { width: 200px; }
    .webcam-md .webcam-cutout { width: 280px; }
    .webcam-lg .webcam-cutout { width: 360px; }

    /* Aspect ratios */
    .ratio-16-9 { aspect-ratio: 16/9; }
    .ratio-3-2 { aspect-ratio: 3/2; }

    /* Hide elements by default */
    .component { display: none; }
    .component.visible { display: block; }
    .component-flex { display: none; }
    .component-flex.visible { display: flex; }

    /* Portrait/Mobile mode (9:16) */
    @media (max-aspect-ratio: 1/1) {
      .main-polaroid {
        padding: 8px;
      }

      .main-polaroid-inner {
        max-width: 100%;
        max-height: calc(100vw * 16 / 9 * 1.12); /* Vertical aspect */
        padding: 8px;
        padding-bottom: 100px; /* More space for stacked socials */
      }

      .main-cutout {
        border-width: 2px;
      }

      /* Smaller tape on mobile */
      .tape {
        width: 60px;
        height: 20px;
      }
      .tape-tl {
        top: -10px;
        left: 20px;
      }
      .tape-tr {
        top: -10px;
        right: 20px;
      }

      /* Smaller corner brackets */
      .main-cutout > .absolute.w-8 {
        width: 1.25rem;
        height: 1.25rem;
      }

      /* Smaller webcam on mobile */
      .webcam-sm .webcam-cutout { width: 140px; }
      .webcam-md .webcam-cutout { width: 180px; }
      .webcam-lg .webcam-cutout { width: 220px; }

      .webcam-frame {
        bottom: 12px;
        right: 12px;
      }
      .webcam-br { bottom: 12px; right: 12px; }
      .webcam-bl { bottom: 12px; left: 12px; }
      .webcam-tr { top: 12px; right: 12px; }
      .webcam-tl { top: 12px; left: 12px; }

      /* Compact horizontal socials on mobile */
      .polaroid-bottom {
        height: 52px;
        padding: 6px 8px;
      }

      #socials.component-flex.visible {
        flex-direction: row;
        gap: 6px;
      }

      #socials a {
        padding: 4px 8px;
        gap: 4px;
      }

      #socials a span {
        font-size: 10px;
      }

      #socials svg {
        width: 12px;
        height: 12px;
      }

      /* Hide heart separators on mobile */
      #socials > span {
        display: none;
      }

      /* Smaller REC indicator */
      .rec-indicator {
        font-size: 11px;
        gap: 4px;
      }
      .rec-dot {
        width: 7px;
        height: 7px;
      }

      /* Smaller timestamp */
      #rec-timestamp {
        font-size: 10px;
      }

      /* Hide some decorative stickers on mobile */
      .main-polaroid-inner > .absolute.top-1\/2 {
        display: none;
      }

      /* Smaller stickers */
      .main-polaroid-inner > .absolute {
        font-size: 1rem;
      }

      /* Smaller emotes */
      #emotes img {
        width: 1.75rem;
        height: 1.75rem;
      }
    }

    /* Extra small screens */
    @media (max-aspect-ratio: 1/1) and (max-height: 700px) {
      .main-polaroid-inner {
        padding-bottom: 48px;
      }

      .polaroid-bottom {
        height: 40px;
      }

      #socials a {
        padding: 3px 6px;
        border-width: 1px;
      }

      #socials a span {
        font-size: 9px;
      }

      #socials svg {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Main Polaroid Frame -->
  <div class="main-polaroid">
    <div class="main-polaroid-inner">
      <!-- Tape decorations -->
      <div class="tape tape-tl"></div>
      <div class="tape tape-tr"></div>

      <!-- Main 16:9 cutout - game shows through here -->
      <div class="main-cutout">
        <!-- Corner brackets on main frame -->
        <div class="absolute top-0 left-0 w-8 h-8 border-t-3 border-l-3 border-hotpink-400"></div>
        <div class="absolute top-0 right-0 w-8 h-8 border-t-3 border-r-3 border-hotpink-400"></div>
        <div class="absolute bottom-0 left-0 w-8 h-8 border-b-3 border-l-3 border-hotpink-400"></div>
        <div class="absolute bottom-0 right-0 w-8 h-8 border-b-3 border-r-3 border-hotpink-400"></div>

        <!-- REC indicator -->
        <div id="rec-indicator" class="rec-indicator absolute top-4 left-4 z-10">
          <div class="rec-dot"></div>
          <span>REC</span>
        </div>

        <!-- Timestamp -->
        <div id="rec-timestamp" class="absolute bottom-4 right-4 font-mono text-sm text-white/90 z-10" style="text-shadow: 0 0 6px rgba(0,0,0,0.9);">
          <span id="timestamp">00:00:00</span>
        </div>

        <!-- Webcam Polaroid Frame (smaller, inside main cutout) -->
        <div id="webcam" class="component webcam-frame webcam-md webcam-br">
          <div class="relative">
            <!-- Mini tape -->
            <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-12 h-5 bg-hotpink-200/60 border border-hotpink-300/40 z-20" style="transform: translateX(-50%) rotate(-6deg);"></div>

            <!-- Webcam polaroid -->
            <div class="bg-white p-1.5 pb-6 shadow-lg border border-alt-200" style="box-shadow: 4px 4px 12px rgba(0,0,0,0.2);">
              <div class="webcam-cutout relative bg-transparent border-2 border-alt-100 ratio-16-9">
                <!-- Corner brackets -->
                <div class="absolute -top-0.5 -left-0.5 w-2.5 h-2.5 border-t-2 border-l-2 border-hotpink-400"></div>
                <div class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 border-t-2 border-r-2 border-hotpink-400"></div>
                <div class="absolute -bottom-0.5 -left-0.5 w-2.5 h-2.5 border-b-2 border-l-2 border-hotpink-400"></div>
                <div class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 border-b-2 border-r-2 border-hotpink-400"></div>
              </div>
            </div>

            <!-- Decorative stickers on webcam frame -->
            <div class="absolute -top-2 -right-3 text-base star-float">⭐</div>
            <div class="absolute -bottom-1 -left-3 text-sm emote-float" style="animation-delay: -1s;">💖</div>
          </div>
        </div>

        <!-- Corner emotes inside main cutout -->
        <div id="emotes" class="component">
          <div id="emote-tl" class="absolute top-4 left-16 emote-float opacity-80">
            <img src="/images/emotes/{{ (index site.Data.emotes.emotes 0).file }}" alt="" class="w-10 h-10">
          </div>
          <div id="emote-tr" class="absolute top-4 right-16 emote-float opacity-80" style="animation-delay: -1s;">
            <img src="/images/emotes/{{ (index site.Data.emotes.emotes 1).file }}" alt="" class="w-10 h-10">
          </div>
        </div>
      </div>

      <!-- Bottom area - for socials and branding -->
      <div class="polaroid-bottom">
        <div id="socials" class="component-flex items-center gap-4">
          <!-- Twitch -->
          <a class="flex items-center gap-2 bg-[#9146FF] text-white px-4 py-2 rounded-full border-2 border-alt-900" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.8);">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
            <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
          </a>
          <span class="text-hotpink-400 text-lg">♡</span>
          <!-- YouTube -->
          <a class="flex items-center gap-2 bg-[#FF0000] text-white px-4 py-2 rounded-full border-2 border-alt-900" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.8);">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
          </a>
          <span class="text-hotpink-400 text-lg">♡</span>
          <!-- TikTok -->
          <a class="flex items-center gap-2 bg-alt-900 text-white px-4 py-2 rounded-full border-2 border-alt-900" style="box-shadow: 3px 3px 0 rgba(0,0,0,0.8);">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
            <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
          </a>
        </div>
      </div>

      <!-- Decorative stickers around main polaroid -->
      <div class="absolute -top-4 -left-6 text-2xl star-float">⭐</div>
      <div class="absolute -top-4 -right-6 text-xl emote-float" style="animation-delay: -2s;">💖</div>
      <div class="absolute -bottom-4 -left-6 text-lg star-float" style="animation-delay: -1s;">✨</div>
      <div class="absolute -bottom-4 -right-6 text-xl emote-float" style="animation-delay: -3s;">💜</div>
      <div class="absolute top-1/2 -left-8 text-lg star-float" style="animation-delay: -2.5s;">🌟</div>
      <div class="absolute top-1/2 -right-8 text-lg star-float" style="animation-delay: -1.5s;">✨</div>
    </div>
  </div>

  <script>
    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);

    // Webcam configuration
    const webcamPos = params.get('webcam') || 'none';
    const webcamRatio = params.get('ratio') || '16:9';
    const webcamSize = params.get('size') || 'md';

    // Other components
    const showSocials = params.get('socials') !== 'false'; // Default true
    const showEmotes = params.get('emotes') || 'none';
    const showRec = params.get('rec') !== 'false'; // Default true

    // Apply webcam settings
    const webcamEl = document.getElementById('webcam');
    if (webcamPos && webcamPos !== 'none') {
      webcamEl.classList.add('visible');

      // Position
      webcamEl.classList.remove('webcam-br', 'webcam-bl', 'webcam-tr', 'webcam-tl');
      webcamEl.classList.add('webcam-' + webcamPos);

      // Size
      webcamEl.classList.remove('webcam-sm', 'webcam-md', 'webcam-lg');
      webcamEl.classList.add('webcam-' + webcamSize);

      // Ratio
      const cutout = webcamEl.querySelector('.webcam-cutout');
      cutout.classList.remove('ratio-16-9', 'ratio-3-2');
      if (webcamRatio === '3:2') {
        cutout.classList.add('ratio-3-2');
      } else {
        cutout.classList.add('ratio-16-9');
      }

      // Hide emote in webcam corner
      if (webcamPos === 'tl') {
        const emote = document.getElementById('emote-tl');
        if (emote) emote.style.display = 'none';
      } else if (webcamPos === 'tr') {
        const emote = document.getElementById('emote-tr');
        if (emote) emote.style.display = 'none';
      }
    }

    // REC indicator
    if (!showRec) {
      document.getElementById('rec-indicator').style.display = 'none';
      document.getElementById('rec-timestamp').style.display = 'none';
    } else {
      // Start timestamp counter
      let seconds = 0;
      const timestampEl = document.getElementById('timestamp');
      setInterval(() => {
        seconds++;
        const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
        const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        timestampEl.textContent = `${h}:${m}:${s}`;
      }, 1000);
    }

    // Show socials (default true now)
    if (showSocials) {
      document.getElementById('socials').classList.add('visible');
    }

    // Show emotes
    const emotesEl = document.getElementById('emotes');
    if (showEmotes === 'corners' || showEmotes === 'true') {
      emotesEl.classList.add('visible');
    }
  </script>
</body>
</html>
