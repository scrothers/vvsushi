<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>OBS Just Chatting</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Floating animation for stars */
    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(5deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(3deg); }
    }

    /* Twinkle animation for stars */
    @keyframes twinkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .star-animate {
      animation: float-star 6s ease-in-out infinite, twinkle 3s ease-in-out infinite;
    }

    /* Combined float and pulse animation for hearts */
    @keyframes heart-float-pulse {
      0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
      12.5% { transform: translateY(-4px) rotate(-47deg) scale(1.08); opacity: 0.5; }
      25% { transform: translateY(-8px) rotate(-45deg) scale(1); opacity: 0.4; }
      37.5% { transform: translateY(-6px) rotate(-43deg) scale(1.08); opacity: 0.5; }
      50% { transform: translateY(-3px) rotate(-45deg) scale(1); opacity: 0.4; }
      62.5% { transform: translateY(-7px) rotate(-47deg) scale(1.08); opacity: 0.5; }
      75% { transform: translateY(-10px) rotate(-45deg) scale(1); opacity: 0.4; }
      87.5% { transform: translateY(-5px) rotate(-43deg) scale(1.08); opacity: 0.5; }
      100% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
    }

    .heart-animate {
      animation: heart-float-pulse 6s ease-in-out infinite;
    }

    .heart-alt::before,
    .heart-alt::after {
      width: inherit;
      height: inherit;
    }

    .heart-alt::before {
      top: -50%;
      left: 0;
    }

    .heart-alt::after {
      top: 0;
      left: 50%;
    }

    /* Floating X marks */
    @keyframes float-x {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(10deg); }
    }

    .x-animate {
      animation: float-x 4s ease-in-out infinite;
    }

  </style>
</head>
<body>
  <!-- Animated Sky Background -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-b from-skyblue-100 via-lavender-50 to-blush-100"></div>
    <div class="absolute inset-0 checker-overlay opacity-30"></div>

    <!-- Clouds -->
    <div class="cloud cloud-1" style="left: -200px;"></div>
    <div class="cloud cloud-1" style="left: 30%; animation-delay: -8s;"></div>
    <div class="cloud cloud-1" style="left: 70%; animation-delay: -15s;"></div>
    <div class="cloud cloud-2" style="left: -150px;"></div>
    <div class="cloud cloud-2" style="left: 50%; animation-delay: -18s;"></div>
    <div class="cloud cloud-3" style="left: -180px;"></div>
    <div class="cloud cloud-3" style="left: 20%; animation-delay: -25s;"></div>
    <div class="cloud cloud-3" style="left: 60%; animation-delay: -12s;"></div>

    <!-- Animated Stars -->
    <div class="star-alt star-animate" style="top: 15%; left: 8%;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 25%; left: 92%; width: 8px; height: 8px; animation-delay: -1s, -0.5s;"></div>
    <div class="star-alt star-animate" style="top: 80%; left: 12%; width: 8px; height: 8px; animation-delay: -4s, -2s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 35%; left: 95%; width: 14px; height: 14px; animation-delay: -1.5s, -0.8s;"></div>
    <div class="star-alt star-animate" style="top: 5%; left: 70%; width: 11px; height: 11px; animation-delay: -1.8s, -0.9s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 90%; left: 85%; width: 10px; height: 10px; animation-delay: -0.8s, -0.4s;"></div>
    <div class="star-alt star-animate" style="top: 72%; left: 5%; width: 13px; height: 13px; animation-delay: -3.8s, -1.9s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 8%; left: 15%; width: 9px; height: 9px; animation-delay: -2.8s, -1.4s;"></div>

    <!-- Animated X marks -->
    <div class="x-mark x-animate" style="top: 20%; left: 90%;">✖</div>
    <div class="x-mark x-animate" style="top: 85%; left: 8%; font-size: 28px; animation-delay: -0.5s;">✖</div>
    <div class="x-mark x-animate" style="top: 10%; left: 5%; font-size: 20px; animation-delay: -1.5s;">✖</div>
    <div class="x-mark x-animate" style="top: 75%; left: 92%; font-size: 24px; animation-delay: -2.3s;">✖</div>

    <!-- Animated Hearts -->
    <div class="heart-alt heart-animate" style="top: 12%; left: 88%;"></div>
    <div class="heart-alt heart-animate" style="top: 85%; left: 3%; animation-delay: -2.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 8%; left: 8%; width: 11px; height: 11px; animation-delay: -3.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 92%; left: 90%; width: 12px; height: 12px; animation-delay: -2s;"></div>
    <div class="heart-alt heart-animate" style="top: 45%; left: 3%; width: 10px; height: 10px; animation-delay: -1.8s;"></div>

    <!-- Sparkle dots -->
    <div class="absolute top-[18%] left-[5%] w-1.5 h-1.5 bg-hotpink-400 rounded-full opacity-60 animate-pulse-soft"></div>
    <div class="absolute top-[82%] left-[92%] w-2 h-2 bg-purple-400 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 0.5s;"></div>
    <div class="absolute top-[8%] left-[92%] w-1.5 h-1.5 bg-periwinkle-500 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 1.5s;"></div>
    <div class="absolute top-[78%] left-[8%] w-2 h-2 bg-hotpink-400 rounded-full opacity-45 animate-pulse-soft" style="animation-delay: 2s;"></div>
    <div class="absolute top-[50%] left-[95%] w-1.5 h-1.5 bg-purple-400 rounded-full opacity-55 animate-pulse-soft" style="animation-delay: 0.3s;"></div>
  </div>

  <!-- Polaroid Frame - Centered, 80% of screen -->
  <div class="fixed inset-0 z-10 flex items-center justify-center pointer-events-none">
    <div class="relative">
      <!-- Tape piece on top -->
      <div class="absolute -top-6 left-1/2 -translate-x-1/2 w-28 h-10 bg-hotpink-200/60 border border-hotpink-300/40 z-20" style="transform: rotate(-8deg);"></div>

      <!-- Polaroid outer frame -->
      <div class="bg-white p-6 pb-24 shadow-2xl border-2 border-alt-200" style="box-shadow: 12px 12px 32px rgba(0,0,0,0.2), 0 0 0 1px rgba(0,0,0,0.05);">
        <!-- Webcam cutout area - 16:9 aspect ratio, 80% of viewport width -->
        <div class="relative bg-transparent border-4 border-alt-100" style="width: 80vw; height: 45vw; max-height: 75vh;">
          <!-- Corner decorations -->
          <div class="absolute -top-1.5 -left-1.5 w-5 h-5 border-t-3 border-l-3 border-hotpink-400"></div>
          <div class="absolute -top-1.5 -right-1.5 w-5 h-5 border-t-3 border-r-3 border-hotpink-400"></div>
          <div class="absolute -bottom-1.5 -left-1.5 w-5 h-5 border-b-3 border-l-3 border-hotpink-400"></div>
          <div class="absolute -bottom-1.5 -right-1.5 w-5 h-5 border-b-3 border-r-3 border-hotpink-400"></div>
        </div>

        <!-- Polaroid bottom area - space for OBS scene name overlay + socials -->
        <div class="absolute bottom-4 left-0 right-0 text-center">
          <!-- Empty space for scene name overlay in OBS -->
          <div class="h-10 mb-3"></div>
          <div class="flex items-center justify-center gap-3">
            <!-- Twitch -->
            <div class="flex items-center gap-2 bg-[#9146FF] text-white px-4 py-1.5 rounded-full border-2 border-alt-900 shadow-hard">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
              <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
            </div>
            <span class="text-hotpink-400 text-lg">♡</span>
            <!-- YouTube -->
            <div class="flex items-center gap-2 bg-[#FF0000] text-white px-4 py-1.5 rounded-full border-2 border-alt-900 shadow-hard">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
              <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
            </div>
            <span class="text-hotpink-400 text-lg">♡</span>
            <!-- TikTok -->
            <div class="flex items-center gap-2 bg-alt-900 text-white px-4 py-1.5 rounded-full border-2 border-alt-900 shadow-hard">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
              <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Decorative stickers around polaroid -->
      <div class="absolute -top-8 -right-8 text-4xl star-animate" style="animation-delay: -1s, -0.5s;">⭐</div>
      <div class="absolute -bottom-6 -left-8 text-3xl heart-animate" style="animation-delay: -2s;">💖</div>
      <div class="absolute top-1/4 -right-10 text-2xl animate-pulse-soft">✨</div>
      <div class="absolute -top-4 -left-10 text-2xl heart-animate" style="animation-delay: -3s;">💜</div>
      <div class="absolute bottom-1/4 -left-10 text-xl star-animate" style="animation-delay: -2.5s, -1.2s;">🌟</div>
      <div class="absolute -bottom-4 -right-10 text-2xl animate-pulse-soft" style="animation-delay: 1s;">✨</div>
    </div>
  </div>
</body>
</html>
