<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Stream Offline</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(5deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .star-animate {
      animation: float-star 6s ease-in-out infinite, twinkle 3s ease-in-out infinite;
    }

    @keyframes heart-float-pulse {
      0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
      25% { transform: translateY(-8px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      50% { transform: translateY(-3px) rotate(-45deg) scale(1); opacity: 0.4; }
      75% { transform: translateY(-10px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      100% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
    }

    .heart-animate {
      animation: heart-float-pulse 6s ease-in-out infinite;
    }

    .heart-alt::before, .heart-alt::after {
      width: inherit;
      height: inherit;
    }
    .heart-alt::before { top: -50%; left: 0; }
    .heart-alt::after { top: 0; left: 50%; }

    @keyframes float-x {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(10deg); }
    }

    .x-animate {
      animation: float-x 4s ease-in-out infinite;
    }

    /* Offline/sleep animations */
    @keyframes float-sleep {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes twinkle-star {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes moon-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 255, 200, 0.4)); }
      50% { filter: drop-shadow(0 0 40px rgba(255, 255, 200, 0.7)); }
    }

    .float-sleep {
      animation: float-sleep 5s ease-in-out infinite;
    }

    .twinkle-star {
      animation: twinkle-star 2s ease-in-out infinite;
    }

    .moon-glow {
      animation: moon-glow 3s ease-in-out infinite;
    }

    @keyframes float-emote {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    .float-emote {
      animation: float-emote 4s ease-in-out infinite;
    }

    @keyframes soft-pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .soft-pulse {
      animation: soft-pulse 3s ease-in-out infinite;
    }

    /* Shooting star */
    @keyframes shooting-star {
      0% { transform: translateX(0) translateY(0); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translateX(300px) translateY(150px); opacity: 0; }
    }

    .shooting-star {
      animation: shooting-star 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Night sky background -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-b from-[#1a1a2e] via-[#25274d] to-[#464866]"></div>
    <div class="absolute inset-0 checker-overlay opacity-10"></div>

    <!-- Twinkling stars background - hide ALL on mobile -->
    <div class="absolute top-[5%] left-[10%] text-white twinkle-star hidden sm:block">✦</div>
    <div class="absolute top-[12%] left-[25%] text-white/80 twinkle-star text-sm hidden sm:block" style="animation-delay: 0.3s;">✦</div>
    <div class="absolute top-[8%] left-[45%] text-white twinkle-star text-xs hidden sm:block" style="animation-delay: 0.7s;">✦</div>
    <div class="absolute top-[15%] left-[65%] text-white/70 twinkle-star hidden sm:block" style="animation-delay: 1s;">✦</div>
    <div class="absolute top-[6%] left-[80%] text-white twinkle-star text-sm hidden sm:block" style="animation-delay: 0.5s;">✦</div>
    <div class="absolute top-[20%] left-[5%] text-white/60 twinkle-star text-xs hidden sm:block" style="animation-delay: 1.2s;">✦</div>
    <div class="absolute top-[18%] left-[90%] text-white twinkle-star hidden sm:block" style="animation-delay: 0.8s;">✦</div>
    <div class="absolute top-[25%] left-[15%] text-white/80 twinkle-star text-sm hidden sm:block" style="animation-delay: 1.5s;">✦</div>
    <div class="absolute top-[22%] left-[55%] text-white twinkle-star text-xs hidden sm:block" style="animation-delay: 0.2s;">✦</div>
    <div class="absolute top-[10%] left-[70%] text-white/70 twinkle-star hidden sm:block" style="animation-delay: 1.8s;">✦</div>
    <div class="absolute top-[30%] left-[8%] text-white twinkle-star text-sm hidden sm:block" style="animation-delay: 0.6s;">✦</div>
    <div class="absolute top-[28%] left-[35%] text-white/60 twinkle-star text-xs hidden sm:block" style="animation-delay: 1.1s;">✦</div>
    <div class="absolute top-[35%] left-[92%] text-white twinkle-star hidden sm:block" style="animation-delay: 0.4s;">✦</div>

    <!-- Shooting star - hide ALL on mobile -->
    <div class="absolute top-[10%] left-[20%] shooting-star hidden sm:block">
      <div class="w-1 h-1 bg-white rounded-full shadow-[0_0_6px_2px_rgba(255,255,255,0.8)]"></div>
    </div>
    <div class="absolute top-[25%] left-[60%] shooting-star hidden sm:block" style="animation-delay: 1.5s;">
      <div class="w-1 h-1 bg-white rounded-full shadow-[0_0_6px_2px_rgba(255,255,255,0.8)]"></div>
    </div>

    <!-- Clouds (darker for night) -->
    <div class="cloud cloud-1 opacity-20" style="left: -200px;"></div>
    <div class="cloud cloud-1 opacity-15" style="left: 50%; animation-delay: -12s;"></div>
    <div class="cloud cloud-2 opacity-10" style="left: -150px;"></div>
    <div class="cloud cloud-3 opacity-15" style="left: 30%; animation-delay: -20s;"></div>

    <!-- Stars (pink accents) - hide ALL on mobile -->
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 70%; left: 5%; width: 10px; height: 10px;"></div>
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 80%; left: 92%; width: 12px; height: 12px; animation-delay: -1s, -0.5s;"></div>
    <div class="star-alt star-alt-pink star-animate hidden sm:block" style="top: 85%; left: 15%; width: 8px; height: 8px; animation-delay: -2s, -1s;"></div>

    <!-- Hearts - hide ALL on mobile -->
    <div class="heart-alt heart-animate hidden sm:block" style="top: 75%; left: 8%; width: 12px; height: 12px;"></div>
    <div class="heart-alt heart-animate hidden sm:block" style="top: 82%; left: 88%; width: 14px; height: 14px; animation-delay: -1.5s;"></div>
  </div>

  <!-- Main Hero Content -->
  <div class="fixed inset-0 z-10 flex flex-col items-center justify-center">
    <!-- Moon decoration - smaller on mobile -->
    <div class="absolute top-[8%] right-[8%] sm:right-[12%] moon-glow">
      <div class="w-16 sm:w-24 h-16 sm:h-24 rounded-full bg-gradient-to-br from-yellow-100 to-yellow-200 shadow-[0_0_40px_15px_rgba(255,255,200,0.3)] sm:shadow-[0_0_60px_20px_rgba(255,255,200,0.3)]"></div>
    </div>

    <!-- Floating emotes (sleepy/dimmed) - smaller on mobile, hide some -->
    <div class="absolute top-[20%] left-[15%] float-emote opacity-40 hidden sm:block" style="animation-delay: -0.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 0).file) | relURL }}" class="w-10 sm:w-16 h-10 sm:h-16 object-contain" alt="">
    </div>
    <div class="absolute top-[25%] right-[18%] float-emote opacity-40" style="animation-delay: -1.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 1).file) | relURL }}" class="w-8 sm:w-14 h-8 sm:h-14 object-contain" alt="">
    </div>
    <div class="absolute bottom-[28%] left-[12%] float-emote opacity-40 hidden sm:block" style="animation-delay: -2s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 2).file) | relURL }}" class="w-8 sm:w-14 h-8 sm:h-14 object-contain" alt="">
    </div>
    <div class="absolute bottom-[25%] right-[15%] float-emote opacity-40" style="animation-delay: -2.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 3).file) | relURL }}" class="w-10 sm:w-16 h-10 sm:h-16 object-contain" alt="">
    </div>

    <!-- Central hero -->
    <div class="text-center relative px-4 sm:px-0">
      <!-- Sleeping emote -->
      <div class="relative mb-4 sm:mb-8 inline-block float-sleep">
        <img id="hero-emote" src="" class="w-24 sm:w-40 h-24 sm:h-40 object-contain mx-auto" alt="">
        <!-- Sleep bubble -->
        <div class="absolute -top-2 sm:-top-4 -right-4 sm:-right-8 bg-white/90 rounded-full px-2 sm:px-4 py-1 sm:py-2 border-2 border-alt-200">
          <span class="text-lg sm:text-2xl">💤</span>
        </div>
        <!-- Little stars around - smaller/fewer on mobile -->
        <span class="absolute -top-3 sm:-top-6 left-0 text-yellow-200 text-sm sm:text-xl twinkle-star">✦</span>
        <span class="absolute -bottom-1 sm:-bottom-2 -left-3 sm:-left-6 text-yellow-200 text-xs sm:text-lg twinkle-star hidden sm:inline" style="animation-delay: 0.5s;">✦</span>
        <span class="absolute top-1/2 -right-6 sm:-right-12 text-yellow-200 text-sm sm:text-xl twinkle-star hidden sm:inline" style="animation-delay: 1s;">✦</span>
      </div>

      <!-- Main text -->
      <h1 class="font-display font-black text-4xl sm:text-6xl md:text-8xl text-white mb-2 sm:mb-4" style="text-shadow: 4px 4px 0 rgba(0,0,0,0.3);">
        CURRENTLY
      </h1>
      <h1 class="font-display font-black text-4xl sm:text-6xl md:text-8xl mb-4 sm:mb-6" style="background: linear-gradient(135deg, #ff69b4, #9b59b6, #3498db); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none;">
        OFFLINE
      </h1>

      <!-- Message box -->
      <div class="bg-white/10 backdrop-blur-sm border-2 border-white/20 px-6 sm:px-10 py-2 sm:py-4 inline-block mb-4 sm:mb-6">
        <p class="font-display font-bold text-sm sm:text-xl text-white/90 tracking-wide">
          Stream is sleeping... check back soon! <span class="soft-pulse inline-block">🌙</span>
        </p>
      </div>

      <!-- Follow prompt -->
      <div class="flex flex-col items-center gap-2 sm:gap-3">
        <p class="font-body text-white/60 text-sm sm:text-lg">
          Follow to get notified when we go live~
        </p>
        <div class="flex items-center gap-2 sm:gap-3 text-lg sm:text-2xl">
          <span class="twinkle-star text-yellow-200" style="animation-delay: 0s;">✦</span>
          <span class="text-hotpink-400 soft-pulse">♡</span>
          <span class="twinkle-star text-yellow-200 hidden sm:inline" style="animation-delay: 0.3s;">✦</span>
          <span class="text-purple-400 soft-pulse" style="animation-delay: 0.5s;">♡</span>
          <span class="twinkle-star text-yellow-200" style="animation-delay: 0.6s;">✦</span>
        </div>
      </div>
    </div>

    <!-- Bottom socials - vertical on mobile, horizontal on desktop -->
    <div class="absolute bottom-4 sm:bottom-12 left-0 right-0 flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-3 px-4">
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-[#9146FF] text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-white/20 shadow-lg min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400/60 text-lg hidden sm:inline">♡</span>
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-[#FF0000] text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-white/20 shadow-lg min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400/60 text-lg hidden sm:inline">♡</span>
      <div class="flex items-center justify-center gap-2 sm:gap-2 bg-white/10 text-white px-6 sm:px-4 py-2 sm:py-1.5 rounded-full border-2 border-white/20 shadow-lg min-w-[160px] sm:min-w-0">
        <svg class="w-5 h-5 sm:w-4 sm:h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        <span class="font-display font-bold text-sm sm:text-sm tracking-wide">@vvSushii</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const emotes = [
        {{- range $i, $e := site.Data.emotes.emotes }}{{ if $i }},{{ end }}"{{ (printf "images/emotes/%s" $e.file) | relURL }}"{{ end }}
      ];
      const img = document.getElementById('hero-emote');
      if (img) img.src = emotes[Math.floor(Math.random() * emotes.length)];
    })();
  </script>
</body>
</html>
