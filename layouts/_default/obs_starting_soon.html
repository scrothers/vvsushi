<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Starting Soon</title>
  {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    @keyframes float-star {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(5deg); }
      50% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .star-animate {
      animation: float-star 6s ease-in-out infinite, twinkle 3s ease-in-out infinite;
    }

    @keyframes heart-float-pulse {
      0% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
      25% { transform: translateY(-8px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      50% { transform: translateY(-3px) rotate(-45deg) scale(1); opacity: 0.4; }
      75% { transform: translateY(-10px) rotate(-45deg) scale(1.08); opacity: 0.5; }
      100% { transform: translateY(0) rotate(-45deg) scale(1); opacity: 0.4; }
    }

    .heart-animate {
      animation: heart-float-pulse 6s ease-in-out infinite;
    }

    .heart-alt::before, .heart-alt::after {
      width: inherit;
      height: inherit;
    }
    .heart-alt::before { top: -50%; left: 0; }
    .heart-alt::after { top: 0; left: 50%; }

    @keyframes float-x {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(10deg); }
    }

    .x-animate {
      animation: float-x 4s ease-in-out infinite;
    }

    /* Hero animations */
    @keyframes bounce-in {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 20, 147, 0.5)); }
      50% { filter: drop-shadow(0 0 40px rgba(255, 20, 147, 0.8)); }
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    .animate-bounce-slow {
      animation: bounce-in 3s ease-in-out infinite;
    }

    .animate-wiggle {
      animation: wiggle 2s ease-in-out infinite;
    }

    .animate-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(1, end) infinite;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .spin-slow {
      animation: spin-slow 20s linear infinite;
    }

    @keyframes float-emote {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    .float-emote {
      animation: float-emote 4s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <!-- Animated Sky Background -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-b from-skyblue-100 via-lavender-50 to-blush-100"></div>
    <div class="absolute inset-0 checker-overlay opacity-30"></div>

    <!-- Clouds -->
    <div class="cloud cloud-1" style="left: -200px;"></div>
    <div class="cloud cloud-1" style="left: 30%; animation-delay: -8s;"></div>
    <div class="cloud cloud-1" style="left: 70%; animation-delay: -15s;"></div>
    <div class="cloud cloud-2" style="left: -150px;"></div>
    <div class="cloud cloud-2" style="left: 50%; animation-delay: -18s;"></div>
    <div class="cloud cloud-3" style="left: -180px;"></div>
    <div class="cloud cloud-3" style="left: 20%; animation-delay: -25s;"></div>
    <div class="cloud cloud-3" style="left: 60%; animation-delay: -12s;"></div>

    <!-- Stars -->
    <div class="star-alt star-animate" style="top: 10%; left: 5%;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 15%; left: 92%; width: 14px; height: 14px; animation-delay: -1s, -0.5s;"></div>
    <div class="star-alt star-animate" style="top: 75%; left: 8%; width: 10px; height: 10px; animation-delay: -2s, -1s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 85%; left: 90%; animation-delay: -3s, -1.5s;"></div>
    <div class="star-alt star-animate" style="top: 40%; left: 3%; width: 12px; height: 12px; animation-delay: -1.5s, -0.8s;"></div>
    <div class="star-alt star-alt-pink star-animate" style="top: 60%; left: 95%; width: 10px; height: 10px; animation-delay: -2.5s, -1.2s;"></div>

    <!-- X marks -->
    <div class="x-mark x-animate" style="top: 20%; left: 8%; font-size: 28px;">✖</div>
    <div class="x-mark x-animate" style="top: 70%; left: 92%; font-size: 24px; animation-delay: -1s;">✖</div>
    <div class="x-mark x-animate" style="top: 85%; left: 15%; font-size: 20px; animation-delay: -2s;">✖</div>
    <div class="x-mark x-animate" style="top: 12%; left: 88%; font-size: 22px; animation-delay: -1.5s;">✖</div>

    <!-- Hearts -->
    <div class="heart-alt heart-animate" style="top: 25%; left: 6%; width: 16px; height: 16px;"></div>
    <div class="heart-alt heart-animate" style="top: 18%; left: 94%; width: 14px; height: 14px; animation-delay: -1.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 80%; left: 5%; width: 12px; height: 12px; animation-delay: -2.5s;"></div>
    <div class="heart-alt heart-animate" style="top: 75%; left: 93%; width: 15px; height: 15px; animation-delay: -3s;"></div>

    <!-- Sparkles -->
    <div class="absolute top-[30%] left-[4%] w-2 h-2 bg-hotpink-400 rounded-full opacity-60 animate-pulse-soft"></div>
    <div class="absolute top-[50%] left-[96%] w-2 h-2 bg-purple-400 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 0.5s;"></div>
    <div class="absolute top-[65%] left-[6%] w-1.5 h-1.5 bg-periwinkle-500 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 1s;"></div>
    <div class="absolute top-[35%] left-[94%] w-1.5 h-1.5 bg-hotpink-500 rounded-full opacity-45 animate-pulse-soft" style="animation-delay: 1.5s;"></div>
  </div>

  <!-- Main Hero Content -->
  <div class="fixed inset-0 z-10 flex flex-col items-center justify-center">
    <!-- Floating emotes around the hero -->
    <div class="absolute top-[15%] left-[15%] text-6xl float-emote" style="animation-delay: -0.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 0).file) | relURL }}" class="w-20 h-20 object-contain" alt="">
    </div>
    <div class="absolute top-[20%] right-[15%] text-6xl float-emote" style="animation-delay: -1.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 1).file) | relURL }}" class="w-16 h-16 object-contain" alt="">
    </div>
    <div class="absolute bottom-[25%] left-[12%] text-6xl float-emote" style="animation-delay: -2s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 2).file) | relURL }}" class="w-18 h-18 object-contain" alt="">
    </div>
    <div class="absolute bottom-[20%] right-[12%] text-6xl float-emote" style="animation-delay: -2.5s;">
      <img src="{{ (printf "images/emotes/%s" (index site.Data.emotes.emotes 3).file) | relURL }}" class="w-20 h-20 object-contain" alt="">
    </div>

    <!-- Central hero -->
    <div class="text-center relative">
      <!-- Decorative spinning ring -->
      <div class="absolute -inset-20 flex items-center justify-center pointer-events-none">
        <div class="w-[500px] h-[500px] border-4 border-dashed border-hotpink-300/30 rounded-full spin-slow"></div>
      </div>

      <!-- Big emote -->
      <div class="animate-bounce-slow mb-8">
        <div class="relative inline-block">
          <img id="hero-emote" src="" class="w-48 h-48 object-contain animate-glow" alt="">
          <!-- Sparkles around emote -->
          <span class="absolute -top-4 -right-4 text-4xl animate-pulse">✨</span>
          <span class="absolute -bottom-2 -left-4 text-3xl animate-pulse" style="animation-delay: 0.5s;">💖</span>
          <span class="absolute top-1/2 -right-8 text-2xl animate-pulse" style="animation-delay: 1s;">⭐</span>
        </div>
      </div>

      <!-- Main text -->
      <div class="relative">
        <h1 class="font-display font-black text-7xl md:text-8xl text-alt-900 mb-4 animate-wiggle" style="text-shadow: 6px 6px 0 rgba(255,105,180,0.3);">
          STARTING SOON
        </h1>
        <div class="bg-hotpink-500 text-white px-8 py-3 inline-block border-4 border-alt-900 shadow-hard">
          <p class="font-display font-bold text-2xl tracking-widest uppercase loading-dots">
            Get ready
          </p>
        </div>
      </div>

      <!-- Decorative elements -->
      <div class="flex items-center justify-center gap-4 mt-8 text-4xl">
        <span class="animate-bounce" style="animation-delay: 0s;">♡</span>
        <span class="animate-bounce" style="animation-delay: 0.1s;">★</span>
        <span class="animate-bounce" style="animation-delay: 0.2s;">♡</span>
        <span class="animate-bounce" style="animation-delay: 0.3s;">✖</span>
        <span class="animate-bounce" style="animation-delay: 0.4s;">♡</span>
        <span class="animate-bounce" style="animation-delay: 0.5s;">★</span>
        <span class="animate-bounce" style="animation-delay: 0.6s;">♡</span>
      </div>
    </div>

    <!-- Bottom socials -->
    <div class="absolute bottom-12 left-0 right-0 flex items-center justify-center gap-3">
      <div class="flex items-center gap-2 bg-[#9146FF] text-white px-4 py-1.5 rounded-full border-2 border-alt-900 shadow-hard">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400 text-lg">♡</span>
      <div class="flex items-center gap-2 bg-[#FF0000] text-white px-4 py-1.5 rounded-full border-2 border-alt-900 shadow-hard">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
      </div>
      <span class="text-hotpink-400 text-lg">♡</span>
      <div class="flex items-center gap-2 bg-alt-900 text-white px-4 py-1.5 rounded-full border-2 border-alt-900 shadow-hard">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        <span class="font-display font-bold text-sm tracking-wide">@vvSushii</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const emotes = [
        {{- range $i, $e := site.Data.emotes.emotes }}{{ if $i }},{{ end }}"{{ (printf "images/emotes/%s" $e.file) | relURL }}"{{ end }}
      ];
      const img = document.getElementById('hero-emote');
      if (img) img.src = emotes[Math.floor(Math.random() * emotes.length)];
    })();
  </script>
</body>
</html>
