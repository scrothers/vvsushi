{{ define "main" }}
<!-- Clips Hero -->
<section class="relative py-12 px-4 overflow-hidden bg-gradient-to-b from-purple-200 via-hotpink-50 to-white">
  <!-- Scattered decorations -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-6 left-[5%] text-6xl opacity-20 rotate-12">★</div>
    <div class="absolute top-16 right-[8%] text-4xl opacity-25 -rotate-6 text-hotpink-400">♡</div>
    <div class="absolute bottom-12 left-[10%] text-3xl opacity-20 rotate-45">✖</div>
    <div class="absolute bottom-8 right-[5%] text-5xl opacity-15 -rotate-12 text-purple-400">★</div>
    <div class="absolute top-1/3 left-[3%] text-2xl opacity-30 text-purple-400">✦</div>
    <div class="absolute top-1/2 right-[3%] text-2xl opacity-25 rotate-12 text-hotpink-400">✦</div>
  </div>

  <div class="container mx-auto max-w-6xl relative">
    <div class="flex flex-col lg:flex-row items-center gap-8 lg:gap-12">

      <!-- Left: Stacked phone frames with emotes -->
      <div class="relative w-72 h-80 flex-shrink-0">
        <!-- Back phone -->
        <div class="absolute top-6 left-6 w-36 h-64 bg-purple-400 border-2 border-alt-900 rounded-2xl rotate-[-12deg] shadow-hard"></div>
        <!-- Middle phone -->
        <div class="absolute top-3 left-3 w-36 h-64 bg-hotpink-400 border-2 border-alt-900 rounded-2xl rotate-[-6deg] shadow-hard"></div>
        <!-- Front phone -->
        <div class="absolute top-0 left-0 w-36 h-64 bg-white border-2 border-alt-900 rounded-2xl shadow-hard overflow-hidden flex flex-col">
          <!-- Phone notch -->
          <div class="h-6 bg-alt-900 flex items-center justify-center">
            <div class="w-16 h-3 bg-alt-700 rounded-full"></div>
          </div>
          <!-- Phone content -->
          <div class="flex-1 bg-gradient-to-b from-periwinkle-100 to-hotpink-100 flex items-center justify-center">
            <img id="clips-hero-emote" src="" alt="emote" class="w-24 h-24 object-contain">
          </div>
          <!-- Phone bottom -->
          <div class="h-4 bg-alt-100 border-t border-alt-200"></div>
        </div>

        <!-- Play button sticker -->
        <div class="absolute -bottom-2 right-4 w-14 h-14 bg-red-500 border-2 border-alt-900 rounded-full flex items-center justify-center shadow-hard rotate-12 z-10">
          <svg class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>

        <!-- "NEW" sticker -->
        <div class="absolute -top-2 right-0 bg-yellow-300 text-alt-900 px-3 py-1 text-xs font-black border-2 border-alt-900 rotate-12 uppercase z-10">
          Fresh!
        </div>

        <!-- Heart sticker -->
        <div class="absolute bottom-8 -left-2 text-3xl rotate-[-15deg]">💜</div>
      </div>

      <!-- Right: Text content -->
      <div class="text-center lg:text-left flex-1">
        <!-- Tag -->
        <div class="inline-block bg-alt-900 text-white px-4 py-1 font-display text-sm uppercase tracking-widest rotate-[-1deg] mb-4">
          ✦ Chaos Captured ✦
        </div>

        <!-- Title -->
        <h1 class="font-display font-black text-5xl sm:text-6xl lg:text-7xl leading-none mb-4">
          <span class="block text-alt-900">BEST</span>
          <span class="block gradient-text" style="text-shadow: 4px 4px 0 rgba(0,0,0,0.1);">MOMENTS</span>
        </h1>

        <!-- Decorative symbols -->
        <div class="flex items-center justify-center lg:justify-start gap-3 text-2xl mb-4">
          <span class="text-red-500">▶</span>
          <span class="text-hotpink-400">♡</span>
          <span class="text-purple-400">★</span>
          <span class="text-alt-400">✖</span>
          <span class="text-hotpink-400">♡</span>
        </div>

        <!-- Description -->
        <div class="bg-purple-100 border-2 border-alt-900 px-4 py-3 rotate-[1deg] inline-block mb-6">
          <p class="text-alt-700 font-medium text-lg">
            Fails, rage moments, and galaxy brain plays 🧠
          </p>
        </div>

        <!-- Platform badges -->
        <div class="flex flex-wrap items-center justify-center lg:justify-start gap-3">
          <div class="bg-white border-2 border-alt-900 px-4 py-2 shadow-hard flex items-center gap-2">
            <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            <span class="font-display font-bold text-alt-800">YouTube</span>
          </div>
          <div class="bg-white border-2 border-alt-900 px-4 py-2 shadow-hard flex items-center gap-2">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
            <span class="font-display font-bold text-alt-800">TikTok</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="mt-12 flex items-center justify-center gap-4">
      <div class="h-0.5 flex-1 bg-alt-900"></div>
      <div class="flex items-center gap-3 text-alt-400">
        <span>✖</span>
        <span class="text-hotpink-400">♡</span>
        <span class="font-display font-bold text-alt-600 uppercase tracking-wide">Scroll & Watch</span>
        <span class="text-hotpink-400">♡</span>
        <span>✖</span>
      </div>
      <div class="h-0.5 flex-1 bg-alt-900"></div>
    </div>
  </div>

  <!-- Random emote script for hero -->
  <script>
    (function() {
      const emotes = [
        {{- range $i, $e := site.Data.emotes.emotes }}{{ if $i }},{{ end }}"/images/emotes/{{ $e.file }}"{{ end }}
      ];
      const img = document.getElementById('clips-hero-emote');
      if (img) img.src = emotes[Math.floor(Math.random() * emotes.length)];
    })();
  </script>
</section>

<!-- Clips Grid -->
<section class="py-12 px-4">
  <div class="container mx-auto max-w-6xl">
    <!-- Loading State -->
    <div id="clips-loading" class="text-center py-12">
      <div class="inline-block animate-spin text-4xl mb-4">✦</div>
      <p class="text-alt-500 font-display">Loading clips...</p>
    </div>

    <!-- Clips Container -->
    <div id="clips-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>
  </div>
</section>

<script>
(function() {
  // Clip data from Hugo
  const clips = {
    tiktok: [
      {{- range $i, $clip := site.Data.clips.tiktok }}{{ if $i }},{{ end }}
      { id: "{{ $clip.id }}", user: "{{ $clip.user }}" }
      {{- end }}
    ],
    youtube: [
      {{- range $i, $clip := site.Data.clips.youtube }}{{ if $i }},{{ end }}
      { id: "{{ $clip.id }}", short: {{ if $clip.short }}true{{ else }}false{{ end }} }
      {{- end }}
    ],
    twitch: [
      {{- range $i, $clip := site.Data.clips.twitch }}{{ if $i }},{{ end }}
      { id: "{{ $clip.id }}" }
      {{- end }}
    ]
  };

  // Flatten and tag clips by platform (excluding Twitch - horizontal doesn't fit)
  const allClips = [
    ...clips.tiktok.map(c => ({ ...c, platform: 'tiktok' })),
    ...clips.youtube.map(c => ({ ...c, platform: 'youtube' }))
  ];

  // Shuffle array (Fisher-Yates)
  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  const shuffled = shuffle(allClips);
  const grid = document.getElementById('clips-grid');
  const loading = document.getElementById('clips-loading');

  // Generate embed HTML for each clip
  shuffled.forEach(clip => {
    const card = document.createElement('div');
    card.className = 'bg-white border-2 border-alt-900 p-3 shadow-hard';

    if (clip.platform === 'tiktok') {
      card.innerHTML = `
        <div class="aspect-[9/16] max-h-[500px] overflow-hidden bg-alt-100 relative">
          <div class="absolute inset-[-15%] scale-[1.3]">
            <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@${clip.user}/video/${clip.id}" data-video-id="${clip.id}" style="max-width:100%;min-width:100%;height:100%;">
              <section></section>
            </blockquote>
          </div>
        </div>
        <div class="flex items-center justify-between mt-2">
          <span class="text-xs text-alt-500 uppercase tracking-wide font-display flex items-center gap-1">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
            TikTok
          </span>
          <a href="https://www.tiktok.com/@${clip.user}/video/${clip.id}" target="_blank" rel="noopener" class="text-xs text-alt-800 hover:text-hotpink-500 font-bold">Open →</a>
        </div>
      `;
    } else if (clip.platform === 'youtube') {
      card.innerHTML = `
        <div class="${clip.short ? 'aspect-[9/16] max-h-[500px]' : 'aspect-video'} overflow-hidden relative">
          <iframe src="https://www.youtube.com/embed/${clip.id}" class="absolute inset-[-10%] w-[120%] h-[120%]" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="flex items-center justify-between mt-2">
          <span class="text-xs text-alt-500 uppercase tracking-wide font-display flex items-center gap-1">
            <svg class="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            ${clip.short ? 'Short' : 'YouTube'}
          </span>
          <a href="https://youtube.com/shorts/${clip.id}" target="_blank" rel="noopener" class="text-xs text-red-500 hover:text-red-700 font-bold">Watch →</a>
        </div>
      `;
    }

    grid.appendChild(card);
  });

  // Load TikTok embed script
  const tiktokScript = document.createElement('script');
  tiktokScript.src = 'https://www.tiktok.com/embed.js';
  tiktokScript.async = true;
  document.body.appendChild(tiktokScript);

  // Show grid
  loading.classList.add('hidden');
  grid.classList.remove('hidden');
})();
</script>
{{ end }}
