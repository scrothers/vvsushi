<!-- Animated Sky Background with Alt Elements -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true">
  <!-- Gradient sky background -->
  <div class="absolute inset-0 bg-gradient-to-b from-skyblue-100 via-lavender-50 to-blush-100"></div>

  <!-- Subtle checker overlay for alt vibe -->
  <div class="absolute inset-0 checker-overlay opacity-30"></div>

  <!-- Clouds Layer 1 (Foreground - faster) -->
  <div class="cloud cloud-1" style="left: -200px;"></div>
  <div class="cloud cloud-1" style="left: 30%; animation-delay: -8s;"></div>
  <div class="cloud cloud-1" style="left: 70%; animation-delay: -15s;"></div>

  <!-- Clouds Layer 2 (Midground) -->
  <div class="cloud cloud-2" style="left: -150px;"></div>
  <div class="cloud cloud-2" style="left: 50%; animation-delay: -18s;"></div>

  <!-- Clouds Layer 3 (Background - slower) -->
  <div class="cloud cloud-3" style="left: -180px;"></div>
  <div class="cloud cloud-3" style="left: 20%; animation-delay: -25s;"></div>
  <div class="cloud cloud-3" style="left: 60%; animation-delay: -12s;"></div>

  <!-- Alt decorative elements - Stars -->
  <div class="star-alt" style="top: 15%; left: 8%;"></div>
  <div class="star-alt star-alt-pink" style="top: 25%; left: 92%; width: 8px; height: 8px;"></div>
  <div class="star-alt" style="top: 45%; left: 5%; width: 10px; height: 10px;"></div>
  <div class="star-alt star-alt-pink" style="top: 65%; left: 88%;"></div>
  <div class="star-alt" style="top: 80%; left: 12%; width: 8px; height: 8px;"></div>
  <div class="star-alt star-alt-pink" style="top: 35%; left: 95%; width: 14px; height: 14px;"></div>

  <!-- X marks scattered -->
  <div class="x-mark" style="top: 20%; left: 85%;">✖</div>
  <div class="x-mark" style="top: 55%; left: 3%; font-size: 18px;">✖</div>
  <div class="x-mark" style="top: 75%; left: 90%; font-size: 32px;">✖</div>
  <div class="x-mark" style="top: 40%; left: 7%; font-size: 20px;">✖</div>

  <!-- Hearts -->
  <div class="heart-alt" style="top: 12%; left: 78%; opacity: 0.4;"></div>
  <div class="heart-alt" style="top: 58%; left: 94%; opacity: 0.3; width: 12px; height: 12px;"></div>
  <div class="heart-alt" style="top: 85%; left: 6%; opacity: 0.5;"></div>

  <!-- Small sparkle dots -->
  <div class="absolute top-[18%] left-[15%] w-1.5 h-1.5 bg-hotpink-400 rounded-full opacity-60 animate-pulse-soft"></div>
  <div class="absolute top-[32%] left-[82%] w-2 h-2 bg-purple-400 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 0.5s;"></div>
  <div class="absolute top-[48%] left-[4%] w-1 h-1 bg-hotpink-500 rounded-full opacity-40 animate-pulse-soft" style="animation-delay: 1s;"></div>
  <div class="absolute top-[62%] left-[91%] w-1.5 h-1.5 bg-periwinkle-500 rounded-full opacity-50 animate-pulse-soft" style="animation-delay: 1.5s;"></div>
  <div class="absolute top-[78%] left-[18%] w-2 h-2 bg-hotpink-400 rounded-full opacity-45 animate-pulse-soft" style="animation-delay: 2s;"></div>
</div>
