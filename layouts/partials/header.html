<header class="sticky top-0 z-50 bg-white border-b-2 border-alt-900">
  <!-- Decorative top stripe -->
  <div class="h-1 bg-gradient-to-r from-hotpink-500 via-purple-500 to-periwinkle-500"></div>

  <nav class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a href="{{ "/" | relURL }}" class="flex items-center gap-3 group">
        <div class="relative">
          <div class="w-11 h-11 bg-white border-2 border-alt-900 shadow-hard flex items-center justify-center overflow-hidden group-hover:shadow-none group-hover:translate-x-0.5 group-hover:translate-y-0.5 transition-all">
            <img id="header-emote" src="" alt="emote" class="w-8 h-8 object-contain">
          </div>
          <!-- Tiny decorative corner -->
          <div class="absolute -top-1 -right-1 w-3 h-3 bg-hotpink-400 border border-alt-900"></div>
        </div>
        <div class="hidden sm:block">
          <span class="font-display font-black text-xl text-alt-900 group-hover:text-hotpink-500 transition-colors">vvSushii</span>
          <div class="flex items-center gap-1 text-[10px] text-alt-400 uppercase tracking-widest">
            <span class="text-hotpink-400">★</span>
            <span>Streamer</span>
            <span class="text-hotpink-400">★</span>
          </div>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex items-center">
        <div class="flex items-center bg-alt-50 border-2 border-alt-900">
          {{- range $i, $item := .Site.Menus.main }}
          <a href="{{ $item.URL }}"
             class="relative px-4 py-2 font-display font-bold text-sm uppercase tracking-wide transition-all
                    {{ if $.IsMenuCurrent "main" $item }}
                    bg-hotpink-500 text-white
                    {{ else }}
                    text-alt-700 hover:bg-alt-900 hover:text-white
                    {{ end }}">
            {{ $item.Name }}
          </a>
          {{ if ne $i (sub (len $.Site.Menus.main) 1) }}
          <div class="w-px h-6 bg-alt-200"></div>
          {{ end }}
          {{- end }}
        </div>
      </div>

      <!-- Right side: Live + Discord/Twitch -->
      <div class="hidden md:flex items-center gap-2 ml-3">
        <!-- Live indicator (hidden by default) -->
        <div id="live-status" class="hidden">
          <a href="https://twitch.tv/{{ .Site.Params.twitch }}" target="_blank" rel="noopener"
             class="flex items-center gap-2 bg-red-500 text-white px-3 py-1.5 font-display font-bold text-xs uppercase tracking-wide border-2 border-alt-900 shadow-hard animate-pulse">
            <span class="w-2 h-2 bg-white rounded-full"></span>
            LIVE
          </a>
        </div>

        <!-- Discord CTA -->
        <a href="https://discord.gg/vvsushii" target="_blank" rel="noopener"
           class="flex items-center gap-2 bg-[#5865F2] text-white px-3 py-2 font-display font-bold text-sm uppercase tracking-wide border-2 border-alt-900 shadow-hard hover:shadow-none hover:translate-x-0.5 hover:translate-y-0.5 transition-all">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.104 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          <span class="hidden xl:inline">Discord</span>
        </a>

        <!-- Twitch CTA -->
        <a href="https://twitch.tv/vvSushii" target="_blank" rel="noopener"
           class="flex items-center gap-2 bg-[#9146FF] text-white px-3 py-2 font-display font-bold text-sm uppercase tracking-wide border-2 border-alt-900 shadow-hard hover:shadow-none hover:translate-x-0.5 hover:translate-y-0.5 transition-all">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
          <span class="hidden xl:inline">Twitch</span>
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button type="button"
              class="lg:hidden w-11 h-11 bg-alt-900 text-white border-2 border-alt-900 flex items-center justify-center shadow-hard hover:shadow-none hover:translate-x-0.5 hover:translate-y-0.5 transition-all"
              x-data
              @click="$dispatch('toggle-mobile-menu')"
              aria-label="Toggle menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div x-data="{ open: false }"
       @toggle-mobile-menu.window="open = !open"
       x-show="open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 -translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0"
       x-transition:leave-end="opacity-0 -translate-y-2"
       class="lg:hidden bg-white border-b-2 border-alt-900">
    <div class="container mx-auto px-4 py-4">
      <!-- Nav links -->
      <div class="grid grid-cols-2 gap-2 mb-4">
        {{- range .Site.Menus.main }}
        <a href="{{ .URL }}"
           class="px-4 py-3 font-display font-bold text-sm uppercase tracking-wide border-2 border-alt-900 text-center transition-all
                  {{ if $.IsMenuCurrent "main" . }}
                  bg-hotpink-500 text-white shadow-hard
                  {{ else }}
                  bg-white text-alt-800 hover:bg-alt-900 hover:text-white
                  {{ end }}">
          {{ .Name }}
        </a>
        {{- end }}
      </div>

      <!-- Decorative divider -->
      <div class="flex items-center gap-3 mb-4">
        <div class="h-px flex-1 bg-alt-200"></div>
        <div class="flex items-center gap-2 text-alt-300 text-sm">
          <span>✖</span>
          <span class="text-hotpink-400">♡</span>
          <span>✖</span>
        </div>
        <div class="h-px flex-1 bg-alt-200"></div>
      </div>

      <!-- Mobile CTAs -->
      <div class="flex gap-2">
        <a href="https://discord.gg/vvsushii" target="_blank" rel="noopener"
           class="flex-1 flex items-center justify-center gap-2 bg-[#5865F2] text-white px-4 py-3 font-display font-bold text-sm uppercase tracking-wide border-2 border-alt-900 shadow-hard">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.104 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Discord
        </a>
        <a href="https://twitch.tv/vvSushii" target="_blank" rel="noopener"
           class="flex-1 flex items-center justify-center gap-2 bg-[#9146FF] text-white px-4 py-3 font-display font-bold text-sm uppercase tracking-wide border-2 border-alt-900 shadow-hard">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
          Twitch
        </a>
      </div>
    </div>
  </div>

  <!-- Header emote randomizer -->
  <script>
    (function() {
      const emotes = [
        {{- range $i, $e := site.Data.emotes.emotes }}{{ if $i }},{{ end }}"{{ (printf "images/emotes/%s" $e.file) | relURL }}"{{ end }}
      ];
      const img = document.getElementById('header-emote');
      if (img) img.src = emotes[Math.floor(Math.random() * emotes.length)];
    })();
  </script>
</header>
