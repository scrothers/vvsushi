{{/* Twitch Clip Embed
     Usage: {{< twitch-clip id="ClipSlugHere" >}}
     Example: {{< twitch-clip id="SparklingCrazyPizzaPartyTime" >}}
*/}}
{{ $id := .Get "id" }}
{{ $parent := .Get "parent" | default "localhost" }}
<div class="clip-embed my-6">
  <div class="relative border-2 border-alt-900 shadow-hard bg-white p-2">
    <div class="aspect-video">
      <iframe
        src="https://clips.twitch.tv/embed?clip={{ $id }}&parent={{ $parent }}&parent=vvsushii.com"
        class="w-full h-full"
        allowfullscreen>
      </iframe>
    </div>
    <div class="flex items-center justify-between mt-2 px-1">
      <span class="text-xs text-alt-500 uppercase tracking-wide font-display">Twitch Clip</span>
      <a href="https://clips.twitch.tv/{{ $id }}" target="_blank" rel="noopener" class="text-xs text-purple-500 hover:text-purple-700 font-bold">Watch on Twitch →</a>
    </div>
  </div>
</div>
